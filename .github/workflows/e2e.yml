name: E2E kind smoke

# Qualifies the released Fabric Node surface only:
# OTLP -> default-deny protection -> persistent queue -> controlled test sink.
# The sink returns 200 after fsync, allowing this workflow to test outage and
# restart recovery without claiming that arbitrary OTLP destinations have the
# same persistence semantics. A realistic ambient-clinical shadow workload
# exercises the public Python SDK; deterministic external dependencies keep the
# test credential-free and free of patient data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            relevant:
              - 'charts/fabric/**'
              - 'components/otel-collector-fabric/**'
              - 'deploy/compose/**'
              - 'sdk/python/**'
              - 'tests/e2e/**'
              - '.github/workflows/e2e.yml'

  kind-smoke:
    name: kind cluster install + smoke
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER: fabric-e2e
      NAMESPACE: fabric-system
      COLLECTOR_IMAGE: fabric-otelcol:e2e
      E2E_PYTHON: /tmp/fabric-e2e-venv/bin/python
      INITIAL_COUNT_FILE: /tmp/fabric-e2e-initial-count
      BASELINE_MANIFEST: /tmp/fabric-e2e-baseline-manifest.json
      RECOVERY_MANIFEST: /tmp/fabric-e2e-recovery-manifest.json
      RUNTIME_EVIDENCE: /tmp/fabric-e2e-runtime.json
      EXPORTED_RECORDS: /tmp/fabric-e2e-records.json
      VERIFICATION_REPORT: /tmp/fabric-e2e-report.json
    steps:
      - name: Short-circuit unrelated changes
        if: needs.detect.outputs.relevant != 'true'
        run: echo "No Fabric Node runtime or packaging changes; smoke not required."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.detect.outputs.relevant == 'true'

      - name: Set up Docker Buildx
        if: needs.detect.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Fabric Node Collector image
        if: needs.detect.outputs.relevant == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: components/otel-collector-fabric
          file: components/otel-collector-fabric/Dockerfile
          push: false
          load: true
          tags: ${{ env.COLLECTOR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        if: needs.detect.outputs.relevant == 'true'
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.30.0
          version: v0.23.0
          wait: 120s

      - name: Load Fabric Node image
        if: needs.detect.outputs.relevant == 'true'
        run: kind load docker-image "${COLLECTOR_IMAGE}" --name "${KIND_CLUSTER}"

      - name: Set up Helm
        if: needs.detect.outputs.relevant == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.15.0

      - name: Install the public Python SDK test workload
        if: needs.detect.outputs.relevant == 'true'
        run: |
          python -m venv /tmp/fabric-e2e-venv
          "${E2E_PYTHON}" -m pip install --upgrade pip
          "${E2E_PYTHON}" -m pip install --editable './sdk/python[otlp]'

      - name: Install controlled fsync test sink
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl create namespace "${NAMESPACE}"
          kubectl create configmap fabric-test-sink \
            --namespace "${NAMESPACE}" \
            --from-file=otlp_sink.py=tests/e2e/support/otlp_sink.py
          kubectl apply --namespace "${NAMESPACE}" -f - <<'YAML'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: fabric-test-sink
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fabric-test-sink
          spec:
            replicas: 1
            selector:
              matchLabels: {app: fabric-test-sink}
            template:
              metadata:
                labels: {app: fabric-test-sink}
              spec:
                containers:
                  - name: sink
                    image: python:3.12-alpine
                    command: [python, /app/otlp_sink.py]
                    env:
                      - {name: SINK_DATA_DIR, value: /data}
                      - {name: SINK_PORT, value: "8080"}
                    ports:
                      - {name: http, containerPort: 8080}
                    readinessProbe:
                      httpGet: {path: /health, port: http}
                      periodSeconds: 2
                    volumeMounts:
                      - {name: script, mountPath: /app, readOnly: true}
                      - {name: data, mountPath: /data}
                volumes:
                  - name: script
                    configMap: {name: fabric-test-sink}
                  - name: data
                    persistentVolumeClaim: {claimName: fabric-test-sink}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: fabric-test-sink
          spec:
            selector: {app: fabric-test-sink}
            ports:
              - {name: http, port: 8080, targetPort: http}
          YAML
          kubectl rollout status deployment/fabric-test-sink \
            --namespace "${NAMESPACE}" --timeout=180s

      - name: Install Collector-only Fabric Node
        if: needs.detect.outputs.relevant == 'true'
        run: |
          helm install fabric-node charts/fabric \
            --namespace "${NAMESPACE}" \
            --values charts/fabric/profiles/shadow-dev.yaml \
            --set namespace.create=false \
            --set otel-collector.image.repository=fabric-otelcol \
            --set otel-collector.image.tag=e2e \
            --set otel-collector.image.pullPolicy=IfNotPresent \
            --set otel-collector.exporter.endpoint=http://fabric-test-sink:8080 \
            --set otel-collector.exporter.sendingQueue.persistence.enabled=true \
            --set otel-collector.exporter.sendingQueue.persistence.fsync=true \
            --set otel-collector.exporter.sendingQueue.persistence.size=1Gi \
            --set otel-collector.exporter.sendingQueue.blockOnOverflow=true \
            --set otel-collector.exporter.retry.maxElapsedTime=0s \
            --set otel-collector.exporter.requireDurableQueue=true \
            --set otel-collector.batch.enabled=false \
            --set otel-collector.debugExporter.enabled=false \
            --wait --timeout 5m
          kubectl wait --for=condition=ready pods \
            --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --timeout=300s

      - name: Run ambient-clinical shadow workflow
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-node-otel-collector 14318:4318 &
          NODE_PF=$!
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          trap 'kill ${NODE_PF} ${SINK_PF} 2>/dev/null || true' EXIT
          sleep 3

          BEFORE=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
          printf '%s\n' "${BEFORE}" > "${INITIAL_COUNT_FILE}"
          "${E2E_PYTHON}" tests/e2e/healthcare_shadow/workload.py \
            --endpoint http://127.0.0.1:14318/v1/traces \
            --run-id baseline \
            --manifest "${BASELINE_MANIFEST}"

          CURRENT="${BEFORE}"
          for attempt in $(seq 1 30); do
            echo "delivery poll ${attempt}/30"
            CURRENT=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
            if [ "${CURRENT}" -gt "${BEFORE}" ]; then break; fi
            sleep 1
          done
          test "${CURRENT}" -gt "${BEFORE}"
          jq -n \
            --argjson before "${BEFORE}" \
            --argjson after "${CURRENT}" \
            '{
              baseline_before: $before,
              baseline_after: $after
            }' > "${RUNTIME_EVIDENCE}"

      - name: Verify destination outage and Collector restart recovery
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-node-otel-collector 14318:4318 &
          NODE_PF=$!
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          trap 'kill ${NODE_PF} ${SINK_PF} 2>/dev/null || true' EXIT
          sleep 3
          BEFORE=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
          COLLECTOR_POD=$(kubectl get pod --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector \
            -o jsonpath='{.items[0].metadata.name}')
          COLLECTOR_BEFORE=$(kubectl get pod "${COLLECTOR_POD}" \
            --namespace "${NAMESPACE}" \
            -o jsonpath='{.metadata.uid}')

          kubectl scale deployment/fabric-test-sink --namespace "${NAMESPACE}" --replicas=0
          kubectl wait --for=delete pods --namespace "${NAMESPACE}" -l app=fabric-test-sink --timeout=120s
          "${E2E_PYTHON}" tests/e2e/healthcare_shadow/workload.py \
            --endpoint http://127.0.0.1:14318/v1/traces \
            --run-id recovery \
            --manifest "${RECOVERY_MANIFEST}"
          sleep 3

          kill "${NODE_PF}" 2>/dev/null || true
          kubectl delete pod "${COLLECTOR_POD}" --namespace "${NAMESPACE}"
          kubectl wait --for=condition=ready pods --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --timeout=300s
          COLLECTOR_AFTER=$(kubectl get pod --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector \
            -o jsonpath='{.items[0].metadata.uid}')

          kubectl scale deployment/fabric-test-sink --namespace "${NAMESPACE}" --replicas=1
          kubectl rollout status deployment/fabric-test-sink \
            --namespace "${NAMESPACE}" --timeout=180s
          kill "${SINK_PF}" 2>/dev/null || true
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          sleep 3

          CURRENT=0
          for attempt in $(seq 1 45); do
            echo "recovery poll ${attempt}/45"
            CURRENT=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
            if [ "${CURRENT}" -gt "${BEFORE}" ]; then break; fi
            sleep 1
          done

          jq \
            --argjson baseline "${BEFORE}" \
            --argjson delivered "${CURRENT}" \
            --arg before "${COLLECTOR_BEFORE}" \
            --arg after "${COLLECTOR_AFTER}" \
            '. + {
              recovery_before: $baseline,
              recovery_after: $delivered,
              destination_outage_observed: true,
              collector_uid_before: $before,
              collector_uid_after: $after
            }' "${RUNTIME_EVIDENCE}" > "${RUNTIME_EVIDENCE}.tmp"
          mv "${RUNTIME_EVIDENCE}.tmp" "${RUNTIME_EVIDENCE}"

          INITIAL=$(cat "${INITIAL_COUNT_FILE}")
          curl -fsS \
            "http://127.0.0.1:18080/records?after=${INITIAL}&limit=200" \
            --output "${EXPORTED_RECORDS}"

      - name: Verify protected reconstruction and recovery
        if: needs.detect.outputs.relevant == 'true'
        run: |
          "${E2E_PYTHON}" tests/e2e/healthcare_shadow/verify.py \
            --records "${EXPORTED_RECORDS}" \
            --manifest "${BASELINE_MANIFEST}" \
            --manifest "${RECOVERY_MANIFEST}" \
            --runtime "${RUNTIME_EVIDENCE}" \
            --report "${VERIFICATION_REPORT}"

      - name: Upload healthcare shadow E2E evidence
        if: always() && needs.detect.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recorder-healthcare-shadow-e2e
          path: |
            /tmp/fabric-e2e-baseline-manifest.json
            /tmp/fabric-e2e-recovery-manifest.json
            /tmp/fabric-e2e-runtime.json
            /tmp/fabric-e2e-records.json
            /tmp/fabric-e2e-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Helm test
        if: needs.detect.outputs.relevant == 'true'
        run: helm test fabric-node --namespace "${NAMESPACE}" --timeout 2m

      - name: Diagnostics
        if: failure() && needs.detect.outputs.relevant == 'true'
        run: |
          kubectl get all,pvc --namespace "${NAMESPACE}" || true
          kubectl describe pods --namespace "${NAMESPACE}" || true
          kubectl logs --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --tail=500 || true
          kubectl logs --namespace "${NAMESPACE}" \
            -l app=fabric-test-sink --tail=500 || true
          kubectl get events --namespace "${NAMESPACE}" --sort-by=.lastTimestamp || true
