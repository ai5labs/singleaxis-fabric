name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch newly disclosed issues in pinned deps.
    - cron: "0 6 * * 1"

# Top-level permissions must stay read-only so ossf/scorecard-action can
# publish its signed result to the public Scorecard webapp. When
# `security-events: write` is set at the workflow level, scorecard's
# sigstore/Fulcio verification rejects the upload with a 400 (see
# https://github.com/ossf/scorecard-action#workflow-restrictions).
# Write scopes are granted per-job only.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # gitleaks-action@v2 now requires a paid licence for orgs. Run
      # the upstream binary directly instead — same detection engine,
      # no licence key, no managed SaaS dependency. The tarball is
      # SHA256-verified against the release's published checksums.txt
      # before extraction so a compromised mirror can't inject a
      # trojaned binary into /usr/local/bin.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sha256sum --check -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to upload trivy-fs.sarif to the Code Scanning API.
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Pin is `v`-prefixed — upstream dropped unprefixed release tags.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          # Without this, the action unsets TRIVY_SEVERITY for SARIF
          # output (see entrypoint.sh), so MEDIUM/LOW findings also
          # trip exit-code:1 — which is why transitive langgraph
          # MEDIUMs were failing this job even after HIGH/CRITICAL
          # fixes. Keep the SARIF scoped to our declared gate.
          limit-severities-for-sarif: "true"
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Image pinned by manifest-list digest (Docker Hub, tag 1.174.0);
    # a floating `semgrep/semgrep` would let upstream pushes change SAST
    # results (or worse) between runs without any repo-side diff.
    container: semgrep/semgrep@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade # 1.174.0
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    permissions:
      contents: read
      # Needed to upload semgrep.sarif to the Code Scanning API.
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run Semgrep
        # dynamic-urllib-use-detected is excluded: the only matches are the
        # generic HTTP guardrail/policy adapters, which POST to an
        # operator-supplied endpoint (tenant config, not attacker-controlled;
        # already flagged with `# noqa: S310`). The Python 3.7 compatibility
        # rule is inapplicable because every Python package requires 3.11+.
        # Excluding these rules keeps them out of the SARIF entirely rather
        # than uploading false-positive findings.
        run: >-
          semgrep scan --config auto --sarif --output semgrep.sarif
          --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
          --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  osv-scanner:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: google/osv-scanner-action/osv-scanner-action@19ec1116569a47416e11a45848722b1af31a857b # v1.9.0
        with:
          scan-args: |-
            --recursive
            --lockfile-only
            --skip-git
            ./

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with:
          sarif_file: scorecard.sarif
