name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check DCO sign-off on all PR commits
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          # --no-merges: a clean merge commit doesn't introduce new authored
          # code — its parents each carry their own DCO trailer. The
          # synthetic merge commit GitHub creates on "Update branch" has no
          # trailer and shouldn't fail the check.
          for sha in $(git rev-list --no-merges "${base}..${head}"); do
            if ! git log -1 --format=%B "${sha}" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit ${sha} is missing a DCO Signed-off-by trailer."
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -gt 0 ]; then
            echo "See CONTRIBUTING.md for how to sign commits (git commit -s)."
            exit 1
          fi
      - name: Check DCO sign-off on HEAD (push events)
        if: github.event_name == 'push'
        run: |
          if ! git log -1 --format=%B HEAD | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
            echo "::error::HEAD commit is missing a DCO Signed-off-by trailer."
            echo "See CONTRIBUTING.md for how to sign commits (git commit -s)."
            exit 1
          fi

  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    # Only lint commits inside an open PR. Squash-merges to main pick
    # up the PR title verbatim, which may not pass strict conventional
    # commits (e.g. "v0.1.2 prep — pre-launch audit fixes (#32)"). The
    # gate already runs on every PR — re-running on push-to-main is
    # redundant AND breaks tag-cutting if the squash title doesn't
    # parse as <type>: <subject>.
    #
    # Skip for dependabot PRs: dependabot's auto-generated titles
    # ("Bump the go_modules group across 3 directories with 1
    # update", 73 chars) and changelog-excerpt bodies (long
    # markdown links) routinely violate header-max-length and
    # body-max-line-length. The squash-merge title is set by the
    # human maintainer at merge-time and still has to pass
    # commitlint when applied — that's where the rule actually
    # matters.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: .commitlintrc.yaml

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DavidAnson/markdownlint-cli2-action@db43aef879112c3119a410d69f66701e0d530809 # v17
        with:
          globs: "**/*.md"

  link-check:
    name: Markdown links
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress --config lychee.toml '**/*.md'
          fail: true

  spec-schema:
    name: Validate spec front-matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install pyyaml jsonschema
      - name: Validate specs
        run: |
          python - <<'PY'
          import datetime, pathlib, sys, yaml, jsonschema
          from jsonschema import Draft202012Validator

          schema = {
            "type": "object",
            "required": ["title", "status", "revision", "last_updated", "owner"],
            "properties": {
              "title":        {"type": "string"},
              "status":       {"enum": ["draft", "accepted", "implemented", "deprecated", "superseded"]},
              "revision":     {"type": "integer", "minimum": 1},
              "last_updated": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"},
              "owner":        {"type": "string"},
              "supersedes":   {"type": ["string", "integer"]},
              "superseded_by":{"type": ["string", "integer"]}
            },
            "additionalProperties": True
          }
          validator = Draft202012Validator(schema)
          errors = 0
          for p in sorted(pathlib.Path("specs").glob("[0-9][0-9][0-9]-*.md")):
            text = p.read_text()
            if not text.startswith("---"):
              print(f"{p}: missing front-matter")
              errors += 1
              continue
            _, fm, _ = text.split("---", 2)
            meta = yaml.safe_load(fm)
            # YAML auto-parses ISO dates as datetime.date; normalise to
            # string so the regex validator sees the canonical form.
            if isinstance(meta.get("last_updated"), datetime.date):
              meta["last_updated"] = meta["last_updated"].isoformat()
            for e in validator.iter_errors(meta):
              print(f"{p}: {e.message}")
              errors += 1
          sys.exit(1 if errors else 0)
          PY

  python-lint-type:
    name: Python lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.13.0
      - name: ruff check
        run: |
          if find . -name "pyproject.toml" -not -path "./node_modules/*" | grep -q .; then
            ruff check .
          else
            echo "No Python projects yet; skipping ruff check."
          fi
      - name: ruff format check
        run: |
          if find . -name "pyproject.toml" -not -path "./node_modules/*" | grep -q .; then
            ruff format --check .
          else
            echo "No Python projects yet; skipping ruff format."
          fi
      - name: Repo-level scripts/ tests
        # Stdlib-only tests covering helpers in scripts/. Currently:
        # SPEC 016 §4.6 changelog [Unreleased] keep-alive validator.
        run: |
          pip install pytest
          pytest scripts/tests/ -q

  python-mypy:
    name: Python mypy (per-package)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          # Layer 1 (public)
          - components/presidio-sidecar
          - components/nemo-sidecar
          - components/prompt-guard-sidecar
          - components/langfuse-bootstrap
          - components/redteam-runner
          - components/update-agent
          - sdk/python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy (isolated against package deps)
        working-directory: ${{ matrix.package }}
        # Each package declares its own [tool.mypy] block (strict,
        # pinned python_version). Running from the package dir with
        # `src tests` picks that config up, so we get real type
        # errors against the package's own dependency graph instead
        # of a repo-root soup with --ignore-missing-imports.
        run: mypy src tests

  python-test:
    name: Python package tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        package:
          # Layer 1 (public)
          - components/presidio-sidecar
          - components/nemo-sidecar
          - components/prompt-guard-sidecar
          - components/langfuse-bootstrap
          - components/redteam-runner
          - components/update-agent
          - sdk/python
        # The SDK is the only package that declares
        # `requires-python = ">=3.11"`; everything else is 3.12+.
        # Exclude 3.11 combinations for the 3.12-floored packages so
        # we test each package against its declared support range.
        exclude:
          - package: components/presidio-sidecar
            python-version: "3.11"
          - package: components/nemo-sidecar
            python-version: "3.11"
          - package: components/prompt-guard-sidecar
            python-version: "3.11"
          - package: components/langfuse-bootstrap
            python-version: "3.11"
          - package: components/redteam-runner
            python-version: "3.11"
          - package: components/update-agent
            python-version: "3.11"
        # Per-package coverage thresholds. These MUST mirror each
        # package's pyproject.toml [tool.pytest.ini_options] addopts
        # `--cov-fail-under=N`. CI enforces the floor even if a
        # package's addopts are changed or dropped. CONTRIBUTING.md
        # guarantees 80% line / 70% branch at minimum; some packages
        # declare a higher bar (SDK 85).
        include:
          - package: components/presidio-sidecar
            threshold: 80
          - package: components/nemo-sidecar
            threshold: 80
          - package: components/prompt-guard-sidecar
            threshold: 80
          - package: components/langfuse-bootstrap
            threshold: 80
          - package: components/redteam-runner
            threshold: 80
          - package: components/update-agent
            threshold: 80
          - package: sdk/python
            threshold: 85
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            package:
              - '${{ matrix.package }}/**'
              - '.github/workflows/ci.yml'
            nemo_starter:
              - 'charts/fabric/charts/nemo-sidecar/**'
      - name: Short-circuit if package contracts are unchanged
        if: >-
          steps.filter.outputs.package != 'true' &&
          (matrix.package != 'components/nemo-sidecar' ||
          steps.filter.outputs.nemo_starter != 'true')
        run: echo "No changes affecting ${{ matrix.package }}; skipping package tests."
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: >-
          steps.filter.outputs.package == 'true' ||
          (matrix.package == 'components/nemo-sidecar' &&
          steps.filter.outputs.nemo_starter == 'true')
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        if: >-
          steps.filter.outputs.package == 'true' ||
          (matrix.package == 'components/nemo-sidecar' &&
          steps.filter.outputs.nemo_starter == 'true')
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest with coverage gate
        if: >-
          steps.filter.outputs.package == 'true' ||
          (matrix.package == 'components/nemo-sidecar' &&
          steps.filter.outputs.nemo_starter == 'true')
        working-directory: ${{ matrix.package }}
        run: pytest --cov --cov-report=term-missing --cov-fail-under=${{ matrix.threshold }}

  typescript-sdk:
    name: TypeScript SDK lint + build + test
    runs-on: ubuntu-latest
    # Advisory job for the first-party TypeScript SDK. Path-filtered to
    # sdk/typescript/** (and this workflow) so it short-circuits to a
    # no-op SUCCESS on pure-Python / docs / chart PRs and doesn't spend
    # Node setup time. Not in the required-ruleset — informational only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ts:
              - 'sdk/typescript/**'
              # The TypeScript suite consumes Python's committed conformance
              # goldens and mirrors the public telemetry contract. A Python
              # contract change must therefore prove cross-SDK parity.
              - 'sdk/python/src/fabric/**'
              - 'sdk/python/tests/conformance/**'
              - '.github/workflows/ci.yml'
      - name: Short-circuit if no TypeScript SDK changes
        if: steps.filter.outputs.ts != 'true'
        run: echo "No sdk/typescript changes; skipping Node lint/build/test."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.filter.outputs.ts == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        if: steps.filter.outputs.ts == 'true'
        working-directory: sdk/typescript
        run: npm ci
      - name: Lint
        if: steps.filter.outputs.ts == 'true'
        working-directory: sdk/typescript
        run: npm run lint
      - name: Typecheck + build
        if: steps.filter.outputs.ts == 'true'
        working-directory: sdk/typescript
        run: |
          npm run typecheck
          npm run build
      - name: Test (conformance vs shared goldens + hash parity)
        if: steps.filter.outputs.ts == 'true'
        working-directory: sdk/typescript
        run: npm test

  helm-lint:
    name: Helm contracts / Kubernetes lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            helm:
              - 'charts/fabric/**'
              - 'components/nemo-sidecar/rails/starter/**'
              - 'components/fabric-relay/examples/**'
              - 'components/fabric-relay/ocb-config.yaml'
              - '.github/workflows/ci.yml'
      - name: Short-circuit if Helm contracts are unchanged
        if: steps.filter.outputs.helm != 'true'
        run: echo "No Helm or packaged runtime contract changes; skipping chart gates."
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: steps.filter.outputs.helm == 'true'
        with:
          version: "v3.15.0"
      - name: Helm lint (umbrella, if scaffolded)
        if: steps.filter.outputs.helm == 'true'
        run: |
          if [ -f charts/fabric/Chart.yaml ]; then
            helm lint charts/fabric
          else
            echo "Umbrella chart not yet scaffolded; skipping."
          fi
      - name: Helm lint (subcharts)
        if: steps.filter.outputs.helm == 'true'
        # Lint each subchart that has a Chart.yaml. The sampler
        # validator requires an HMAC key source, so pass one.
        run: |
          shopt -s nullglob
          found=0
          for chart in charts/fabric/charts/*/Chart.yaml; do
            dir="$(dirname "$chart")"
            echo "::group::helm lint ${dir}"
            helm lint "${dir}" --set fabric.sampler.hmacKey=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
            echo "::endgroup::"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "No subcharts found."
          fi
      - name: Helm template smoke render
        if: steps.filter.outputs.helm == 'true'
        run: |
          shopt -s nullglob
          for chart in charts/fabric/charts/*/Chart.yaml; do
            dir="$(dirname "$chart")"
            echo "::group::helm template ${dir}"
            helm template ci "${dir}" --set fabric.sampler.hmacKey=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff \
              | head -1
            echo "::endgroup::"
          done
      - name: Chart render assertions
        if: steps.filter.outputs.helm == 'true'
        # Per-chart shell tests that assert specific render-time behaviour
        # (e.g. spec 016 §4.1: traces: pipeline gating, §4.3: hmacKey
        # render-time validation). Each script is self-contained and
        # exits non-zero on failure.
        run: |
          shopt -s nullglob
          for script in charts/fabric/charts/*/tests/*.sh; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
      - name: Umbrella schema and profile assertions
        if: steps.filter.outputs.helm == 'true'
        # Closed values schemas and deployment-profile tests live at the
        # umbrella level, so they are intentionally separate from subchart
        # render assertions.
        run: |
          shopt -s nullglob
          for script in charts/fabric/tests/*.sh; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done

  release-identity:
    name: Coordinated release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            identity:
              - 'VERSION'
              - 'scripts/verify_release_identity.py'
              - 'scripts/tests/test_verify_release_identity.py'
              - 'scripts/tests/fixtures/release_identity_cases.json'
              - 'charts/fabric/Chart.yaml'
              - 'charts/fabric/Chart.lock'
              - 'charts/fabric/values.yaml'
              - 'charts/fabric/charts/*/Chart.yaml'
              - 'components/*/ocb-config.yaml'
              - 'components/*/src/**/_version.py'
              - 'sdk/python/pyproject.toml'
              - 'sdk/python/src/fabric/_version.py'
              - 'sdk/python/src/fabric/_attributes.py'
              - 'sdk/typescript/package.json'
              - 'sdk/typescript/package-lock.json'
              - 'sdk/typescript/src/attributes.ts'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
      - name: Short-circuit if release declarations are unchanged
        if: steps.filter.outputs.identity != 'true'
        run: echo "No coordinated release identity changes; skipping verifier."
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.filter.outputs.identity == 'true'
        with:
          python-version: "3.12"
      - name: Install verifier test dependency
        if: steps.filter.outputs.identity == 'true'
        run: python -m pip install pytest==8.4.2
      - name: Test release identity verifier
        if: steps.filter.outputs.identity == 'true'
        run: python -m pytest scripts/tests/test_verify_release_identity.py -q
      - name: Verify repository release identity
        if: steps.filter.outputs.identity == 'true'
        run: python scripts/verify_release_identity.py --json

  fabricctl:
    name: fabricctl test / vet / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            fabricctl:
              - 'tools/fabricctl/**'
              - '.github/workflows/ci.yml'
      - name: Short-circuit if fabricctl is unchanged
        if: steps.filter.outputs.fabricctl != 'true'
        run: echo "No fabricctl changes; skipping Go gates."
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.filter.outputs.fabricctl == 'true'
        with:
          go-version: "1.25"
          cache: false
      - name: Test
        if: steps.filter.outputs.fabricctl == 'true'
        working-directory: tools/fabricctl
        run: go test ./...
      - name: Vet
        if: steps.filter.outputs.fabricctl == 'true'
        working-directory: tools/fabricctl
        run: go vet ./...
      - name: Reproducible build
        if: steps.filter.outputs.fabricctl == 'true'
        working-directory: tools/fabricctl
        run: make build VERSION=ci COMMIT="${GITHUB_SHA}" DATE=1970-01-01T00:00:00Z

  fabric-relay:
    name: Fabric Relay component / chart / OCB validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            relay:
              - 'components/fabric-relay/**'
              - 'charts/fabric/charts/fabric-relay/**'
              - 'charts/fabric/Chart.yaml'
              - 'charts/fabric/values.yaml'
              - 'charts/fabric/values.schema.json'
              - 'charts/fabric/profiles/**'
              - 'VERSION'
              - '.github/workflows/ci.yml'
      - name: Short-circuit if Relay contracts are unchanged
        if: steps.filter.outputs.relay != 'true'
        run: echo "No Fabric Relay changes; skipping component gates."
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: steps.filter.outputs.relay == 'true'
        with:
          version: "v3.15.0"
      - name: Static configuration assertions
        if: steps.filter.outputs.relay == 'true'
        working-directory: components/fabric-relay
        run: make test
      - name: Relay chart assertions
        if: steps.filter.outputs.relay == 'true'
        run: bash charts/fabric/charts/fabric-relay/tests/test-render.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.filter.outputs.relay == 'true'
        with:
          go-version: "1.25"
          cache: false
      - name: Install pinned OpenTelemetry Collector Builder
        if: steps.filter.outputs.relay == 'true'
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.150.0
      - name: Build Relay distribution with OCB
        if: steps.filter.outputs.relay == 'true'
        working-directory: components/fabric-relay
        run: '"$(go env GOPATH)/bin/builder" --config ocb-config.yaml'
      - name: Validate production and development configurations
        if: steps.filter.outputs.relay == 'true'
        working-directory: components/fabric-relay
        run: |
          FABRIC_RELAY_AUTH_HEADER=ci-placeholder ./dist/fabric-relay validate --config examples/production.yaml
          ./dist/fabric-relay validate --config examples/development.yaml

  collector-image-build:
    name: Collector image build (PR smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: components/otel-collector-fabric
          file: components/otel-collector-fabric/Dockerfile
          push: false
          load: true
          tags: fabric-otelcol:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run --version
        run: |
          docker run --rm --entrypoint=/otelcol-fabric fabric-otelcol:pr --help \
            | head -5

  relay-image-build:
    name: Fabric Relay image build (PR smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Relay (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: components/fabric-relay
          file: components/fabric-relay/Dockerfile
          push: false
          load: true
          tags: fabric-relay:pr
          cache-from: type=gha,scope=fabric-relay
          cache-to: type=gha,mode=max,scope=fabric-relay
      - name: Smoke-run --help
        run: docker run --rm fabric-relay:pr --help | head -5

  sidecar-image-build:
    name: Sidecar image build (PR smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        component:
          - presidio-sidecar
          - nemo-sidecar
          - prompt-guard-sidecar
          - redteam-runner
          - update-agent
          - langfuse-bootstrap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.component }} (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: components/${{ matrix.component }}
          file: components/${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: fabric-${{ matrix.component }}:pr
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  trivy-scan:
    name: Trivy ${{ matrix.image }} container scan (PR)
    runs-on: ubuntu-latest
    # PR-only: scanning on every main push would double the spend
    # for the same commits already scanned on the incoming PR.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fabric-otelcol
            context: components/otel-collector-fabric
            dockerfile: components/otel-collector-fabric/Dockerfile
          - image: fabric-relay
            context: components/fabric-relay
            dockerfile: components/fabric-relay/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.image }} image for scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:trivy
          cache-from: type=gha,scope=trivy-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=trivy-${{ matrix.image }}
      - name: Trivy image scan
        # Upstream only publishes v-prefixed tags (`v0.36.0`). Pinning
        # `@0.36.0` (no prefix) was failing CI with "unable to find
        # version 0.36.0" — the unprefixed `0.24.0` tag that used to
        # resolve was removed upstream at some point.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:trivy
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          # Without this, the action unsets TRIVY_SEVERITY for SARIF
          # output (see entrypoint.sh), so any MEDIUM/LOW finding also
          # trips exit-code:1. We want HIGH/CRITICAL as the gate.
          limit-severities-for-sarif: "true"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  license-header:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        with:
          config: .licenserc.yaml

  component-meta:
    name: Component metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install pyyaml jsonschema
      - name: Validate .component-meta.yaml files
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          schema_keys = {"name", "language", "owner", "primary_spec"}
          errors = 0
          for meta_path in pathlib.Path("components").rglob(".component-meta.yaml"):
            meta = yaml.safe_load(meta_path.read_text()) or {}
            missing = schema_keys - set(meta)
            if missing:
              print(f"{meta_path}: missing keys {missing}")
              errors += 1
            spec = meta.get("primary_spec", "")
            if spec and not pathlib.Path(spec).exists():
              print(f"{meta_path}: primary_spec {spec} not found")
              errors += 1
          sys.exit(1 if errors else 0)
          PY
