apiVersion: v2
name: fabric
description: |
  SingleAxis Fabric Node — customer-controlled passive recorder for
  observable AI activity. Capture, protect, and deliver without changing
  or delaying the monitored system.
type: application
version: 0.8.0-rc.2
appVersion: "0.8.0-rc.2"
kubeVersion: ">=1.29.0-0"
keywords:
  - ai-observability
  - observability
  - opentelemetry
  - audit
home: https://github.com/singleaxis/singleaxis-fabric
sources:
  - https://github.com/singleaxis/singleaxis-fabric
maintainers:
  - name: SingleAxis
    url: https://singleaxis.com
icon: ""
annotations:
  category: Compliance
  licenses: Apache-2.0

# Fabric Node v1 deliberately packages one runtime: the Fabric Collector.
# Other source charts remain in the repository for compatibility and research,
# but they are not dependencies or customer-facing toggles of this release.
dependencies:
  - name: otel-collector
    version: 0.4.0
    condition: otelCollector.enabled
    repository: ""
    tags:
      - telemetry
