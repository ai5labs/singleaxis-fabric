{{- include "otel-collector.validatePolicy" . -}}
{{- if and .Values.fabric.policy.enabled .Values.fabric.policy.referencePolicy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.referencePolicyConfigMapName" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-egress-policy
  annotations:
    fabric.singleaxis.ai/policy-kind: limited-reference-baseline
    fabric.singleaxis.ai/policy-version: {{ .Values.fabric.policy.referencePolicy.version | quote }}
    fabric.singleaxis.ai/policy-limitation: "event-class and tenant-id admission only; not tenant authorization"
immutable: true
data:
  reference.rego: |
    package fabric.egress

    import rego.v1

    # This policy is intentionally narrow. fabricguard performs the
    # field allowlist; this policy admits only known classes carrying
    # an event-level tenant identifier. It is not an authorization
    # decision and does not replace a customer-owned egress policy.
    default allow := false

    known_event_classes := {
      "decision_summary",
      "cost_usage_aggregate",
      "escalation",
      "red_team_result",
    }

    allow if {
      input.event_class in known_event_classes
      is_string(input.attributes.tenant_id)
      input.attributes.tenant_id != ""
    }
{{- end }}
