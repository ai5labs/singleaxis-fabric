apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force a pod roll when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/otelcol-fabric/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.service.ports.otlpGrpc }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.service.ports.otlpHttp }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.ports.health }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-fabric
              readOnly: true
            {{- if and .Values.fabric.sampler.enabled .Values.fabric.sampler.hmacKeySecret.name }}
            - name: sampler-key
              mountPath: /etc/fabric/sampler
              readOnly: true
            {{- end }}
            {{- if and .Values.fabric.policy.enabled .Values.fabric.policy.bundlePath }}
            - name: policy-bundle
              mountPath: {{ .Values.fabric.policy.bundlePath }}
              readOnly: true
            {{- end }}
            {{- if .Values.fabric.redact.enabled }}
            - name: redact-socket
              mountPath: {{ include "otel-collector.redactSocketMountPath" . }}
            {{- end }}
        {{- if and .Values.fabric.redact.enabled (eq .Values.fabric.redact.provider.mode "sidecar") }}
        - name: presidio-redactor
          image: "{{ .Values.fabric.redact.provider.sidecar.image.repository }}:{{ .Values.fabric.redact.provider.sidecar.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.fabric.redact.provider.sidecar.image.pullPolicy }}
          args:
            - --uds
            - {{ .Values.fabric.redact.unixSocket | quote }}
            - --tenant-key-file
            - {{ printf "/etc/fabric/tenant/%s" .Values.fabric.redact.provider.sidecar.tenantKeySecret.key | quote }}
            - --redaction-mode
            - {{ .Values.fabric.redact.provider.sidecar.redactionMode | quote }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - {{ printf "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect(%q); s.sendall(b'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n'); assert b'200 OK' in s.recv(256)" .Values.fabric.redact.unixSocket | quote }}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - {{ printf "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect(%q); s.sendall(b'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n'); assert b'200 OK' in s.recv(256)" .Values.fabric.redact.unixSocket | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.fabric.redact.provider.sidecar.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.fabric.redact.provider.sidecar.securityContext | nindent 12 }}
          volumeMounts:
            - name: redact-socket
              mountPath: {{ include "otel-collector.redactSocketMountPath" . }}
            - name: redact-tmp
              mountPath: /tmp
            - name: redact-tenant-key
              mountPath: /etc/fabric/tenant
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- if and .Values.fabric.sampler.enabled .Values.fabric.sampler.hmacKeySecret.name }}
        - name: sampler-key
          secret:
            secretName: {{ .Values.fabric.sampler.hmacKeySecret.name }}
            items:
              - key: {{ .Values.fabric.sampler.hmacKeySecret.key | default "hmac_key" }}
                path: hmac_key
        {{- end }}
        {{- if and .Values.fabric.policy.enabled .Values.fabric.policy.bundlePath }}
        - name: policy-bundle
          configMap:
            name: {{ .Values.fabric.policy.bundleConfigMap }}
        {{- end }}
        {{- if .Values.fabric.redact.enabled }}
        - name: redact-socket
          {{- if eq .Values.fabric.redact.provider.mode "sidecar" }}
          emptyDir: {}
          {{- else }}
          {{- toYaml .Values.fabric.redact.provider.externalVolume.volumeSource | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- if and .Values.fabric.redact.enabled (eq .Values.fabric.redact.provider.mode "sidecar") }}
        - name: redact-tmp
          emptyDir: {}
        - name: redact-tenant-key
          secret:
            secretName: {{ .Values.fabric.redact.provider.sidecar.tenantKeySecret.name }}
            items:
              - key: {{ .Values.fabric.redact.provider.sidecar.tenantKeySecret.key }}
                path: {{ .Values.fabric.redact.provider.sidecar.tenantKeySecret.key }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
