# Default values for the Fabric OTel Collector subchart.
# See charts/fabric/charts/otel-collector/README.md for the rationale
# behind each block.

replicaCount: 1

image:
  repository: ghcr.io/singleaxis/fabric-otelcol
  tag: ""              # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Distroless nonroot posture per spec 008.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  # All three ports the collector listens on. Disable any you don't
  # terminate in your deployment to shrink the exposed surface.
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    health: 13133

# OTLP ingress transport security. Supplying serverCertificateSecret.name
# enables TLS for both the gRPC and HTTP receivers. Supplying clientCASecret
# additionally makes both receivers verify client certificates (mTLS).
# Secret data is projected into the pod and referenced by file path; it is
# never copied into the Collector ConfigMap or Helm release values.
receiver:
  # Fail the render unless receiver TLS is configured. Regulated profiles
  # pin this on; the default remains false for local development clients.
  requireTLS: false
  # Fail the render unless TLS verifies client certificates against an
  # operator-provisioned CA. This implies requireTLS.
  requireClientCertificate: false
  tls:
    serverCertificateSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
    clientCASecret:
      name: ""
      key: ca.crt

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Liveness/readiness budgets sized for cold pulls of the multi-arch
# OTel Collector image (~40 MB) plus pipeline initialisation. The
# previous 5s readiness initial delay marked pods Unready repeatedly
# during rolling deploys on slow networks.
livenessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

# Gates liveness/readiness until the Collector has loaded its complete
# pipeline configuration. These probes report Collector process health;
# they deliberately do not claim that the remote telemetry backend is
# reachable. Queue/export failure metrics must be alerted separately.
startupProbe:
  httpGet:
    path: /
    port: health
  periodSeconds: 2
  failureThreshold: 30
  timeoutSeconds: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# The Fabric-authored processors. Each block maps directly to the
# processor's own config keys in the rendered Collector config. Set
# `.enabled: false` to omit the processor from the pipeline entirely.
fabric:
  # Deny-by-default schema allowlist. Always on in production.
  guard:
    enabled: true
    eventClassAttribute: event_class
    dropUnknownClasses: true
    maxFieldBytes: 8192
    extraAllowedFields: {}
    # Render the OTLP `traces` pipeline alongside `logs`. The SDK ships
    # trace spans; without this the chart silently drops them on the
    # collector floor. Default true so trace export works out of the
    # box; set false to opt out (e.g. logs-only deployments).

    traceProcessingEnabled: true

  # OPA policy gate. Bundle is optional — without it the processor is
  # wired but passes everything through, which lets an operator stage
  # the pipeline before shipping Rego.
  policy:
    enabled: true
    bundlePath: ""       # e.g. /etc/fabric/policy
    # Name of a ConfigMap whose .rego file(s) are mounted at
    # bundlePath. A non-empty path without this setting or the
    # versioned reference policy below is rejected at render time;
    # the chart never substitutes an emptyDir for a policy bundle.
    bundleConfigMap: ""
    # A deliberately small, chart-owned policy for installations that
    # need structurally complete wiring before a tenant policy is ready.
    # v1 only admits the four Fabric event classes known to fabricguard,
    # and requires a non-empty tenant_id on the event itself. It is NOT
    # a tenant authorization policy and must be replaced for production
    # decisions beyond telemetry egress admission.
    referencePolicy:
      enabled: false
      version: v1
    query: data.fabric.egress.allow
    eventClassAttribute: event_class

  # Presidio telemetry redaction over a pod-local Unix socket. Enabling
  # the processor requires the embedded sidecar below: a provider name
  # is not evidence that a socket is actually mounted into this pod.
  # This protects captured telemetry before export; it does not inspect
  # or redact prompts before an LLM call.
  redact:
    enabled: false
    unixSocket: /var/run/fabric/presidio.sock
    timeoutMs: 500
    eventClassAttribute: event_class
    # Secure default: redact valid UTF-8 bytes and fail closed on opaque
    # bytes. `passthrough` is a legacy exemption and must be selected
    # deliberately; `reject` drops every non-empty byte value.
    byteHandling: redact_utf8
    skipAttributes:
      - tenant_id
      - agent_id
      - decision_id
    embedded:
      enabled: false
      image:
        repository: ghcr.io/singleaxis/fabric-presidio-sidecar
        tag: ""          # defaults to this chart's appVersion
        pullPolicy: IfNotPresent
      # The sidecar refuses to start without a real tenant HMAC key.
      # The Secret is customer-created and is never rendered by Helm.
      tenantKeySecret:
        name: ""
        key: tenant.key
      redactionMode: hmac
      # Dev-only no-op escape hatch supported by the image. The chart
      # rejects it by default for all production-shaped installs.
      allowPassthrough: false
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        # Must match the Collector: the UDS is intentionally mode 0600.
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop: [ALL]
      resources:
        limits:
          cpu: "1000m"
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
      startupProbe:
        periodSeconds: 2
        failureThreshold: 30
        timeoutSeconds: 2
      readinessProbe:
        periodSeconds: 5
        failureThreshold: 3
        timeoutSeconds: 2

  # Deterministic HMAC sampler. Either `hmacKey` (inline, not
  # recommended outside dev) or `hmacKeySecret` (Secret name + key)
  # must be set when `.enabled: true`.
  #
  # DEFAULT IS OFF. The collector now installs by default (see the
  # umbrella's `otelCollector.enabled`), and this processor cannot
  # render without a key an operator has to supply. Auto-generating one
  # is not an option: a `randAlphaNum` key would rotate on every
  # `helm upgrade`, silently changing every deterministic sampling
  # decision. Off is also the conservative choice for an audit trail —
  # the sampler REDUCES data (`rates.decision_summary: 0.1` drops 90%
  # of decision summaries), so a default install keeps everything.
  #
  # Turn it on with a key once telemetry volume is the problem:
  #   --set otel-collector.fabric.sampler.enabled=true \
  #   --set otel-collector.fabric.sampler.hmacKeySecret.name=<secret>
  #
  # Both shipped profiles set `enabled` explicitly, so neither is
  # affected by this default.
  #
  # `hmacKey` must be a 64-character lowercase hex string (32 bytes).
  # Generate one with:
  #
  #     openssl rand -hex 32
  #
  # The chart fails at render time if the value is not 64-char hex,
  # so a bad key cannot ship as a running pod. For production, prefer
  # `hmacKeySecret` referencing a Kubernetes Secret rather than the
  # inline value (avoids the key landing in rendered manifests, Helm
  # release storage, and GitOps history).
  sampler:
    enabled: false
    hmacKey: ""
    hmacKeySecret:
      name: ""
      key: hmac_key
    defaultRate: 1.0
    rates:
      decision_summary: 0.1
      cost_usage_aggregate: 1.0
      escalation: 1.0
      red_team_result: 1.0

# OTLP/HTTP egress target.
#
# IMPORTANT: there is no default that works in an L1-only OSS deploy.
# The historical default `http://fabric-ingest:8080` resolved to the
# SingleAxis commercial Telemetry Bridge service, which is NOT shipped
# in this OSS distribution.
#
# WHAT HAPPENS WHEN THIS IS EMPTY: the `otlp_http/fabric` exporter is
# not rendered at all, and the pipelines fall back to the `debug`
# exporter. Spans go to the collector pod's stdout and are readable
# with `kubectl logs`; NOTES.txt prints a loud post-install warning.
# Nothing is silently dropped, but stdout is NOT durable and is NOT an
# audit trail — it is a dev posture only. Set a real endpoint before
# you rely on any retention or compliance claim.
#
# Set this to whichever OTLP/HTTP backend the operator wants to fan
# out to:
#
#   --set otel-collector.exporter.endpoint=https://otlp.<datadog>.com:443
#       (Datadog OTLP intake)
#
#   --set otel-collector.exporter.endpoint=http://api.honeycomb.io:443
#       (Honeycomb)
#
#   --set otel-collector.exporter.endpoint=http://your-collector:4318
#       (your own collector chain)
#
# The bundled `langfuse` subchart is NOT a drop-in OTLP sink: it is
# opt-in, needs an external Postgres DSN, and its Service is named
# `<release>-langfuse` (not `langfuse`). Whether the pinned upstream
# version accepts OTLP/HTTP on /v1/traces at all is unresolved — see
# the chart README. Do not point this at it without checking.
#
# For partner deployments running the SingleAxis commercial Telemetry
# Bridge, use the Bridge's ingress endpoint here.
exporter:
  endpoint: ""
  # Transport security. `insecure=true` is retained as the dev default
  # because a bare chart has no endpoint. Regulated profiles set false,
  # require an https:// endpoint, and reject insecureSkipVerify.
  insecure: true
  insecureSkipVerify: false
  requireTLS: false
  tls:
    # Secrets are created by the operator; Helm renders only file paths.
    caSecret:
      name: ""
      key: ca.crt
    clientCertificateSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
  auth:
    # Adds exactly one secret-backed HTTP header to OTLP/HTTP requests.
    # The secret value is injected into the pod environment and is never
    # copied into values, the rendered ConfigMap, or Helm release data.
    headerName: Authorization
    secret:
      name: ""
      key: authorization
  requireAuth: false
  # Fail the render when `endpoint` is empty instead of falling back to
  # the debug exporter. Default false, so a bare install works and is
  # loudly warned about. Profiles that make a retention or compliance
  # claim set this true — pod stdout is not an audit trail, and a
  # regulated deployment should be forced to name its backend rather
  # than quietly inherit a dev posture. `eu-ai-act-high-risk` sets it.
  requireEndpoint: false

  # Exporter helper resilience. An in-memory queue survives short backend
  # failures but not pod/node loss. Persistence switches the workload to a
  # StatefulSet and creates one retained PVC per replica, unless an existing
  # claim is selected (existing claims are restricted to one replica).
  sendingQueue:
    enabled: true
    numConsumers: 10
    queueSize: 1000
    blockOnOverflow: false
    persistence:
      enabled: false
      directory: /var/lib/otelcol-fabric/storage
      fsync: false
      existingClaim: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClass: ""
      annotations: {}
  retry:
    enabled: true
    initialInterval: 5s
    maxInterval: 30s
    maxElapsedTime: 5m
  timeout: 30s

  # Compliance profiles use this render-time invariant rather than relying
  # on a convention spread across several independent values.
  requireDurableQueue: false

# Also write to the debug exporter? Useful in dev, noisy in prod.
# NOTE: the debug exporter is added automatically whenever
# `exporter.endpoint` is empty, regardless of this flag — that is the
# no-silent-drop fallback. This flag adds it ALONGSIDE a configured
# OTLP endpoint.
debugExporter:
  enabled: false
  verbosity: basic

memoryLimiter:
  checkIntervalSeconds: 1
  limitMib: 512

batch:
  timeoutSeconds: 5
  sendBatchSize: 512

# PodDisruptionBudget. Default enabled so the audit-trail span
# stream isn't dropped during node drains. Honored only when
# replicaCount > 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy. Default off because not every CNI enforces them and
# misconfigured policies will silently break the OTLP path. Turn on
# in regulated profiles (eu-ai-act-high-risk sets denyDefault
# alongside this).
#
# `ingressFrom` is appended verbatim to the OTLP ingress rule. Empty
# means "any namespace in the cluster"; tenants typically narrow to
# specific agent namespaces:
#
#   ingressFrom:
#     - namespaceSelector:
#         matchLabels:
#           fabric.singleaxis.ai/agent: "true"
#
# `egressTo` is for the configured exporter endpoint plus any extra
# destinations the operator declares (e.g. an external OTLP gateway,
# Tempo, Honeycomb). DNS to kube-system is always allowed.
networkPolicy:
  enabled: false
  ingressFrom: []
  # Exporter egress is distinct from additional destinations so regulated
  # profiles can prove that an operator deliberately named both a peer and
  # its ports. The chart cannot infer a CIDR or namespace from an arbitrary
  # exporter URL.
  exporterEgress:
    requireExplicit: false
    to: []
    ports: []
  # Additional non-exporter peers. This compatibility surface remains for
  # DNS-independent internal services and operator extensions.
  egressTo: []
