{{- include "fabric-relay.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fabric-relay.configName" . }}
  labels:
    {{- include "fabric-relay.labels" . | nindent 4 }}
immutable: true
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpGrpc }}
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric-relay/receiver/server/{{ .Values.receiver.tls.serverCertificateSecret.certKey }}
              key_file: /etc/fabric-relay/receiver/server/{{ .Values.receiver.tls.serverCertificateSecret.privateKeyKey }}
              client_ca_file: /etc/fabric-relay/receiver/client-ca/{{ .Values.receiver.tls.clientCASecret.key }}
            {{- end }}
          http:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpHttp }}
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric-relay/receiver/server/{{ .Values.receiver.tls.serverCertificateSecret.certKey }}
              key_file: /etc/fabric-relay/receiver/server/{{ .Values.receiver.tls.serverCertificateSecret.privateKeyKey }}
              client_ca_file: /etc/fabric-relay/receiver/client-ca/{{ .Values.receiver.tls.clientCASecret.key }}
            {{- end }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.service.ports.health }}
      {{- if .Values.destination.endpoint }}
      file_storage:
        directory: {{ .Values.queue.directory | quote }}
        create_directory: true
        timeout: 1s
        compaction:
          directory: {{ .Values.queue.compactionDirectory | quote }}
          on_start: true
          on_rebound: true
      {{- end }}

    processors:
      memory_limiter:
        check_interval: {{ .Values.memoryLimiter.checkInterval }}
        limit_mib: {{ .Values.memoryLimiter.limitMib }}
        spike_limit_mib: {{ .Values.memoryLimiter.spikeLimitMib }}
      batch:
        timeout: {{ .Values.batch.timeout }}
        send_batch_size: {{ .Values.batch.sendBatchSize }}

    exporters:
      {{- if .Values.destination.endpoint }}
      otlphttp/destination:
        endpoint: {{ .Values.destination.endpoint | quote }}
        {{- if and .Values.destination.compression (ne .Values.destination.compression "none") }}
        compression: {{ .Values.destination.compression }}
        {{- end }}
        timeout: {{ .Values.destination.timeout }}
        {{- if .Values.destination.auth.secretRef.name }}
        headers:
          {{ .Values.destination.auth.headerName | quote }}: ${env:FABRIC_RELAY_AUTH_HEADER}
        {{- end }}
        tls:
          insecure: {{ .Values.destination.tls.insecure }}
          insecure_skip_verify: {{ .Values.destination.tls.insecureSkipVerify }}
          {{- if .Values.destination.tls.caSecret.name }}
          ca_file: /etc/fabric-relay/tls/ca/{{ .Values.destination.tls.caSecret.key }}
          {{- end }}
          {{- if .Values.destination.tls.clientCertificateSecret.name }}
          cert_file: /etc/fabric-relay/tls/client/{{ .Values.destination.tls.clientCertificateSecret.certKey }}
          key_file: /etc/fabric-relay/tls/client/{{ .Values.destination.tls.clientCertificateSecret.privateKeyKey }}
          {{- end }}
        sending_queue:
          enabled: true
          num_consumers: {{ .Values.queue.numConsumers }}
          queue_size: {{ .Values.queue.queueSize }}
          storage: file_storage
          block_on_overflow: {{ .Values.queue.blockOnOverflow }}
        retry_on_failure:
          enabled: true
          initial_interval: {{ .Values.retry.initialInterval }}
          max_interval: {{ .Values.retry.maxInterval }}
          max_elapsed_time: {{ .Values.retry.maxElapsedTime }}
      {{- end }}
      {{- if or .Values.debugExporter.enabled (not .Values.destination.endpoint) }}
      debug:
        verbosity: {{ .Values.debugExporter.verbosity }}
      {{- end }}

    service:
      extensions:
        - health_check
        {{- if .Values.destination.endpoint }}
        - file_storage
        {{- end }}
      telemetry:
        logs:
          level: {{ .Values.telemetry.logLevel }}
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.service.ports.metrics }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.destination.endpoint }}otlphttp/destination{{ if .Values.debugExporter.enabled }}, debug{{ end }}{{ else }}debug{{ end }}]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.destination.endpoint }}otlphttp/destination{{ if .Values.debugExporter.enabled }}, debug{{ end }}{{ else }}debug{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.destination.endpoint }}otlphttp/destination{{ if .Values.debugExporter.enabled }}, debug{{ end }}{{ else }}debug{{ end }}]
