apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fabric-relay.fullname" . }}
  labels:
    {{- include "fabric-relay.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fabric-relay.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.retentionPolicy.whenScaled }}
  selector:
    matchLabels:
      {{- include "fabric-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fabric-relay.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fabric-relay.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: relay
          image: {{ include "fabric-relay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/fabric-relay/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: {{ .Values.service.ports.otlpGrpc }}, protocol: TCP }
            - { name: otlp-http, containerPort: {{ .Values.service.ports.otlpHttp }}, protocol: TCP }
            - { name: metrics, containerPort: {{ .Values.service.ports.metrics }}, protocol: TCP }
            - { name: health, containerPort: {{ .Values.service.ports.health }}, protocol: TCP }
          {{- if .Values.destination.auth.secretRef.name }}
          env:
            - name: FABRIC_RELAY_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.destination.auth.secretRef.name }}
                  key: {{ .Values.destination.auth.secretRef.key }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/fabric-relay
              readOnly: true
            - name: queue
              mountPath: /var/lib/fabric-relay
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            - name: receiver-server-tls
              mountPath: /etc/fabric-relay/receiver/server
              readOnly: true
            - name: receiver-client-ca
              mountPath: /etc/fabric-relay/receiver/client-ca
              readOnly: true
            {{- end }}
            {{- if .Values.destination.tls.caSecret.name }}
            - name: destination-ca
              mountPath: /etc/fabric-relay/tls/ca
              readOnly: true
            {{- end }}
            {{- if .Values.destination.tls.clientCertificateSecret.name }}
            - name: destination-client-tls
              mountPath: /etc/fabric-relay/tls/client
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fabric-relay.configName" . }}
        {{- if not .Values.persistence.enabled }}
        - name: queue
          emptyDir: {}
        {{- end }}
        {{- if .Values.receiver.tls.serverCertificateSecret.name }}
        - name: receiver-server-tls
          secret:
            secretName: {{ .Values.receiver.tls.serverCertificateSecret.name }}
            items:
              - key: {{ .Values.receiver.tls.serverCertificateSecret.certKey }}
                path: {{ .Values.receiver.tls.serverCertificateSecret.certKey }}
              - key: {{ .Values.receiver.tls.serverCertificateSecret.privateKeyKey }}
                path: {{ .Values.receiver.tls.serverCertificateSecret.privateKeyKey }}
        - name: receiver-client-ca
          secret:
            secretName: {{ .Values.receiver.tls.clientCASecret.name }}
            items:
              - key: {{ .Values.receiver.tls.clientCASecret.key }}
                path: {{ .Values.receiver.tls.clientCASecret.key }}
        {{- end }}
        {{- if .Values.destination.tls.caSecret.name }}
        - name: destination-ca
          secret:
            secretName: {{ .Values.destination.tls.caSecret.name }}
            items:
              - key: {{ .Values.destination.tls.caSecret.key }}
                path: {{ .Values.destination.tls.caSecret.key }}
        {{- end }}
        {{- if .Values.destination.tls.clientCertificateSecret.name }}
        - name: destination-client-tls
          secret:
            secretName: {{ .Values.destination.tls.clientCertificateSecret.name }}
            items:
              - key: {{ .Values.destination.tls.clientCertificateSecret.certKey }}
                path: {{ .Values.destination.tls.clientCertificateSecret.certKey }}
              - key: {{ .Values.destination.tls.clientCertificateSecret.privateKeyKey }}
                path: {{ .Values.destination.tls.clientCertificateSecret.privateKeyKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: queue
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- end }}
