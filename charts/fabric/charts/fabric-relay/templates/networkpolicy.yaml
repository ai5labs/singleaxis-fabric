{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fabric-relay.fullname" . }}
  labels:
    {{- include "fabric-relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fabric-relay.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ .Values.service.ports.otlpGrpc }} }
        - { protocol: TCP, port: {{ .Values.service.ports.otlpHttp }} }
  {{- else }}
  # An enabled policy with no sources is deny-all, never allow-all.
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.networkPolicy.egressTo }}
    - to:
        {{- toYaml .Values.networkPolicy.egressTo | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.destinationPort }} }
    {{- end }}
{{- end }}
