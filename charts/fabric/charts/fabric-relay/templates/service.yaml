apiVersion: v1
kind: Service
metadata:
  name: {{ include "fabric-relay.fullname" . }}
  labels:
    {{- include "fabric-relay.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fabric-relay.selectorLabels" . | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: {{ .Values.service.ports.otlpGrpc }}, targetPort: otlp-grpc, protocol: TCP }
    - { name: otlp-http, port: {{ .Values.service.ports.otlpHttp }}, targetPort: otlp-http, protocol: TCP }
    - { name: metrics, port: {{ .Values.service.ports.metrics }}, targetPort: metrics, protocol: TCP }
    - { name: health, port: {{ .Values.service.ports.health }}, targetPort: health, protocol: TCP }
