mode: production
receiver:
  tls:
    serverCertificateSecret:
      name: relay-server-tls
    clientCASecret:
      name: relay-client-ca
destination:
  endpoint: https://offline.example.invalid
  allowedEndpoints:
    - https://offline.example.invalid
  auth:
    secretRef:
      name: relay-auth
      key: authorization
persistence:
  enabled: true
  storageClass: encrypted-rwo
debugExporter:
  enabled: false
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          access: fabric-relay
  egressTo:
    - ipBlock:
        cidr: 203.0.113.0/24
