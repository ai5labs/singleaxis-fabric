# Explicitly choose development or production. Development is intentionally
# non-durable and writes to pod logs when destination.endpoint is empty.
mode: development

replicaCount: 1

image:
  repository: ghcr.io/singleaxis/fabric-relay
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    metrics: 8888
    health: 13133

receiver:
  tls:
    # Production requires a server certificate and a client CA. Both OTLP/gRPC
    # and OTLP/HTTP then require clients to present a certificate issued by the
    # configured CA. Certificate material is never accepted inline.
    serverCertificateSecret:
      name: ""
      certKey: tls.crt
      privateKeyKey: tls.key
    clientCASecret:
      name: ""
      key: ca.crt

destination:
  # Base OTLP/HTTP endpoint. The exporter appends /v1/{signal}.
  endpoint: ""
  # Production requires an exact match in this list. It is a deployment-time
  # guard against accidental/malicious redirection, not a network firewall.
  allowedEndpoints: []
  compression: gzip
  timeout: 30s
  tls:
    insecure: false
    insecureSkipVerify: false
    caSecret:
      name: ""
      key: ca.crt
    clientCertificateSecret:
      name: ""
      certKey: tls.crt
      privateKeyKey: tls.key
  auth:
    # The complete header value is read from a pre-existing Secret. There is
    # deliberately no inline credential value.
    headerName: Authorization
    secretRef:
      name: ""
      key: authorization

persistence:
  enabled: false
  size: 20Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  annotations: {}
  selector: {}
  retentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

queue:
  # Persistent file_storage paths are constrained to this chart's fixed PVC
  # mount, /var/lib/fabric-relay. Traversal and alternate roots are rejected.
  directory: /var/lib/fabric-relay/queue
  compactionDirectory: /var/lib/fabric-relay/compaction
  numConsumers: 10
  queueSize: 10000
  blockOnOverflow: true

retry:
  initialInterval: 5s
  maxInterval: 30s
  # 0s means retry indefinitely. Required in production.
  maxElapsedTime: 0s

debugExporter:
  enabled: true
  verbosity: basic

memoryLimiter:
  checkInterval: 1s
  limitMib: 768
  spikeLimitMib: 192

batch:
  timeout: 5s
  sendBatchSize: 512

telemetry:
  logLevel: info

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet: { path: /, port: health }
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: { path: /, port: health }
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  # Production requires one or more explicit selectors. When this is empty,
  # enabling NetworkPolicy renders ingress: [] (deny all), never allow-all.
  ingressFrom: []
  # Standard Kubernetes NetworkPolicy cannot enforce DNS names. Supply CIDRs
  # for the approved destination or enforce egress at a mesh/firewall layer.
  # Production requires at least one explicitly restricted peer. World CIDRs
  # and empty peers/selectors are rejected.
  egressTo: []
  destinationPort: 443
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    matchLabels:
      k8s-app: kube-dns

terminationGracePeriodSeconds: 60
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Accepted because the umbrella CI passes this existing key to every subchart.
# It has no effect on Fabric Relay.
fabric: {}
global: {}
