# Default values for the update-agent subchart.

replicaCount: 2                    # HA by default; admission must be reliable

image:
  repository: ghcr.io/singleaxis/fabric-update-agent
  tag: ""                          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 443
  targetPort: 8443

resources:
  limits:
    cpu: "500m"
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

readinessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 2
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 10
  periodSeconds: 20

nodeSelector: {}
tolerations: []
affinity: {}

# --- Verifier config ---
#
# What the webhook believes about the cluster + who it trusts.
# ``fabricVersion`` must match the umbrella chart's version; CI
# guarantees alignment for the bundled version, operators should
# override this explicitly when running a mixed-version fleet.
#
# ``trustedKeys`` is the list of Ed25519 signers the verifier
# accepts. The default ships the SingleAxis release key baked into
# the chart. Operators running against a tenant mirror supply their
# mirror's key via ``extraTrustedKeys``.
config:
  fabricVersion: ""                # "" → use .Chart.AppVersion
  failClosed: true
  # Allow ``helm template`` and ``helm lint`` to render the chart with
  # the placeholder publicKey for review purposes only. Default false
  # so a real ``helm install`` still fails-loud on the placeholder.
  # The deployed binary re-validates at startup — this flag only
  # affects template rendering.
  allowPlaceholderKey: false
  trustedKeys:
    - id: singleaxis-release
      # Placeholder — replace at install time with the real release
      # key. Shipping an empty string would render the chart unable
      # to verify anything, which is worse than a clearly fake key.
      publicKey: "REPLACE_AT_INSTALL_TIME_WITH_REAL_KEY_32_BYTES_BASE64"
  extraTrustedKeys: []
  # - id: tenant-mirror
  #   publicKey: "..."

# --- Webhook wiring ---
#
# Namespaces the webhook watches. Defaults to ``fabric-system`` only
# so the verifier never blocks an unrelated application's apply.
# Add tenant-specific namespaces (e.g. `fabric-policy`) as the
# operator widens the GitOps channel's surface.
webhook:
  watchedNamespaces:
    - fabric-system
  # "Fail" = apply is rejected when the webhook is unreachable.
  # Production should leave this on; "Ignore" is for break-glass
  # only.
  failurePolicy: Fail
  timeoutSeconds: 5
  # Resources the webhook intercepts. ConfigMaps + Secrets cover
  # the channel's deliverables; the operator can extend this list
  # when registering additional schemas at runtime.
  rules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["configmaps", "secrets"]
  # Profile-lock admission backstop (docs/regulatory-profiles.md).
  #
  # When active, the verifier DENIES any ConfigMap carrying the
  # otel-collector config naming (name suffix `-otel-collector-config`
  # or labels app.kubernetes.io/{part-of=fabric,name=otel-collector})
  # whose rendered collector config drops a profile-locked control:
  # fabricguard missing, guard.drop_unknown_classes != true, or
  # fabricredact missing, or either processor is declared but absent
  # from the active logs/traces pipelines. This catches direct
  # `kubectl edit` drift that bypasses Helm — the render-time invariant
  # (fabric.validateProfileLocks in the parent chart) cannot.
  #
  # Scope: only traffic in webhook.watchedNamespaces reaches the
  # webhook (VWC namespaceSelector), so enforcement is scoped there.
  #
  # Modes:
  #   auto (default) — ON when the release namespace carries the
  #       label singleaxis.com/profile=eu-ai-act-high-risk, i.e. when
  #       the EU high-risk profile was rendered with
  #       namespace.create=true. CAVEAT: on a FIRST install into a
  #       brand-new namespace the Namespace object does not exist at
  #       render time yet, so auto resolves OFF until the next
  #       `helm upgrade`. Set `on` to pin it from day one; the shipped
  #       EU profile does this explicitly.
  #   on  — always enforce.
  #   off — never enforce (dev clusters; permissive-dev posture).
  enforceProfileLocks: auto

# --- TLS ---
#
# The webhook server needs a cert the API server trusts. Two modes:
#
#   tls.mode: selfSigned  — chart renders a Secret with a fresh
#                           self-signed cert, and the
#                           ValidatingWebhookConfiguration's
#                           caBundle is populated from it. Fine for
#                           dev + airgapped tenants.
#
#   tls.mode: certManager — chart assumes cert-manager is installed
#                           and renders a Certificate CR pointing
#                           at ``tls.certManager.issuerRef``. The
#                           webhook's caBundle is populated via the
#                           cert-manager.io/inject-ca-from
#                           annotation. The server watches the projected
#                           Secret and restarts when cert-manager rotates
#                           it so uvicorn reloads the leaf certificate.
tls:
  mode: selfSigned                 # one of: selfSigned | certManager
  certManager:
    issuerRef:
      name: fabric-ca-issuer
      kind: ClusterIssuer
      group: cert-manager.io

# --- ArgoCD integration (optional) ---
#
# Ship an ArgoCD Application + AppProject that targets the
# SingleAxis manifest repo. Disabled by default — most tenants
# already have an ArgoCD instance configured outside the chart.
argocd:
  enabled: false
  namespace: argocd
  project:
    name: fabric
    description: "SingleAxis Fabric — manifest channel"
    sourceRepos:
      - https://github.com/singleaxis/fabric-manifests
    destinations:
      - namespace: fabric-system
        server: https://kubernetes.default.svc
  application:
    name: fabric-manifests
    repoURL: https://github.com/singleaxis/fabric-manifests
    path: tenants/default
    targetRevision: HEAD
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
  # PreSync verify hook.
  #
  # ArgoCD only honours hook resources that appear in the SYNCED
  # SOURCE of an Application — an annotation on the Application object
  # itself does nothing. Where the hook lands depends on topology:
  #
  #   * Chart managed by ArgoCD (Application-of-applications, helm
  #     source): this chart renders the hook Job below; ArgoCD lifts
  #     it out of the generated manifests and runs it before sync.
  #   * Application points at the plain manifests repo (the
  #     argocd-application.yaml template above): copy this Job's
  #     rendered output into that repo so the hook ships with the
  #     channel it guards.
  #
  # The Job clones the SAME repo/path/revision the Application syncs,
  # then runs `fabric-update-agent verify` over every YAML document —
  # a deny (exit 2) fails the hook and aborts the sync before any
  # resource is applied. Needs no RBAC and no network beyond the git
  # clone; private repos require credentials the chart does not
  # manage (use an ArgoCD repo-server-side secret or a PAT-scoped
  # https URL).
  presyncHook:
    enabled: true          # rendered only when argocd.enabled is true
    gitImage: alpine/git:v2.47.2
    cloneDepth: 1

# PodDisruptionBudget. Default enabled because the webhook is on
# the admission path with failurePolicy=Fail; losing both replicas
# during a node drain blocks ConfigMap/Secret CREATE/UPDATE
# cluster-wide. Honored only when replicaCount > 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy. Default ON: an admission webhook is security
# infrastructure, so it ships with least-privilege networking out of
# the box rather than asking every operator to opt in.
#
# Ingress rationale — the kube-apiserver is the ONLY caller (admission
# callbacks), and its source IP cannot be pinned: control-plane IPs
# vary by cluster topology (managed control planes have no stable,
# knowable pod/node identity a NetworkPolicy peer can match), and
# several CNIs treat webhook traffic as cluster-scoped anyway. So the
# default rule admits ingress on the webhook port from any namespace
# (`namespaceSelector: {}`) and relies on TLS + signature verification
# for authn — the port carries nothing else. Operators on enforcing
# CNIs can narrow `ingressFrom` (e.g. to kube-system), accepting the
# risk of apiserver-callback drops on their CNI.
#
# Egress is DNS-only because the verifier does no outbound calls.
networkPolicy:
  enabled: true
  ingressFrom: []
