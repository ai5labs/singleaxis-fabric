{{- if .Values.argocd.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.application.name }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "update-agent.labels" . | nindent 4 }}
  annotations:
    # NOTE: ArgoCD honours PreSync hooks only on resources in the
    # SYNCED SOURCE — an annotation here would do nothing. The actual
    # hook Job is rendered by templates/argocd-presync-hook.yaml (see
    # argocd.presyncHook in values.yaml): when ArgoCD manages THIS
    # chart it runs as a real PreSync hook; for repo-type Applications
    # like this one, copy the rendered Job into the manifests repo.
    # The sync-wave keeps the Application itself ordered after the
    # webhook is up in Application-of-applications topologies.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ .Values.argocd.project.name }}
  source:
    repoURL: {{ .Values.argocd.application.repoURL | quote }}
    path: {{ .Values.argocd.application.path | quote }}
    targetRevision: {{ .Values.argocd.application.targetRevision | quote }}
  destination:
    namespace: {{ (index .Values.argocd.project.destinations 0).namespace | quote }}
    server: {{ (index .Values.argocd.project.destinations 0).server | quote }}
  syncPolicy:
    {{- toYaml .Values.argocd.application.syncPolicy | nindent 4 }}
{{- end }}
