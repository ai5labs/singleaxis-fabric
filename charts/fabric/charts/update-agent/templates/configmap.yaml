{{/*
Verifier config, consumed by `fabric-update-agent serve --config`.
Schema mirrors fabric_update_agent.config.VerifierConfig; extra keys
are ignored so operators can safely templatize downstream.

Fail-closed on the placeholder publicKey — see validateTrustedKeys
in _helpers.tpl. Shipping the literal "REPLACE_AT_INSTALL_TIME…"
into a rendered manifest means signature verification would always
fail silently, which is worse than failing the render.
*/}}
{{- include "update-agent.validateTrustedKeys" . -}}
{{/*
Resolve the profile-lock admission backstop.

  on   -> enforce_locked_fields: true
  off  -> false
  auto -> true only when the release namespace carries the parent
          chart's profile label (singleaxis.com/profile), i.e. the EU
          high-risk profile was rendered with namespace.create=true.
          Offline renders (`helm template`, `helm lint`) and
          first-install-into-new-namespace see no Namespace object via
          `lookup` and resolve to false — set `on` to pin it.

The label is stamped by the parent chart's Namespace template
(fabric.labels), so this stays in sync with whatever profile was
actually applied last — Helm cannot distinguish profile defaults from
user --set overrides inside values alone.
*/}}
{{- $mode := .Values.webhook.enforceProfileLocks | default "auto" -}}
{{- $enforce := false -}}
{{- if eq $mode "on" -}}
{{- $enforce = true -}}
{{- else if eq $mode "auto" -}}
{{- $nsObj := lookup "v1" "Namespace" "" .Release.Namespace -}}
{{- if $nsObj -}}
{{- $nsLabels := dig "metadata" "labels" (dict) $nsObj -}}
{{- if eq (get $nsLabels "singleaxis.com/profile" "") "eu-ai-act-high-risk" -}}
{{- $enforce = true -}}
{{- end -}}
{{- end -}}
{{- else if ne $mode "off" -}}
{{- fail (printf "webhook.enforceProfileLocks must be one of: auto | on | off (got %q)." ($mode | toString)) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "update-agent.configMapName" . }}
  labels:
    {{- include "update-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    fabric_version: {{ .Values.config.fabricVersion | default .Chart.AppVersion | quote }}
    fail_closed: {{ .Values.config.failClosed }}
    enforce_locked_fields: {{ $enforce }}
    trusted_keys:
      {{- range concat .Values.config.trustedKeys .Values.config.extraTrustedKeys }}
      - id: {{ .id | quote }}
        public_key: {{ .publicKey | quote }}
      {{- end }}
