{{/*
ArgoCD PreSync hook: run the CLI verifier over the manifest channel
BEFORE the sync applies anything — a deny fails loud at sync time
instead of surfacing as a half-applied, webhook-rejected rollout.

ArgoCD honours hook annotations only on resources in the SYNCED
SOURCE (see argocd.presyncHook in values.yaml for the two topologies
this covers). The Job shares the Application's repoURL/path/
targetRevision so it verifies exactly what the sync would apply.
*/}}
{{- if and .Values.argocd.enabled .Values.argocd.presyncHook.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "update-agent.fullname" . }}-presync-verify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "update-agent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "update-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: update-agent-presync-hook
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The update-agent image ships no git client; clone with a
        # minimal git image into a shared volume.
        - name: clone
          image: {{ .Values.argocd.presyncHook.gitImage | quote }}
          command:
            - sh
            - -ec
            - |
              rev={{ .Values.argocd.application.targetRevision | quote }}
              if [ "$rev" = "HEAD" ]; then
                git clone --depth {{ .Values.argocd.presyncHook.cloneDepth }} \
                  {{ .Values.argocd.application.repoURL | quote }} /work/repo
              else
                git clone --depth {{ .Values.argocd.presyncHook.cloneDepth }} \
                  --branch "$rev" {{ .Values.argocd.application.repoURL | quote }} /work/repo
              fi
              cp -r "/work/repo/{{ .Values.argocd.application.path }}/." /manifests/
          env:
            - name: HOME
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: manifests
              mountPath: /manifests
      containers:
        - name: verify
          image: {{ include "update-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              found=0
              find /manifests -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 |
                xargs -0 -n1 fabric-update-agent verify --config /etc/fabric/update-agent/config.yaml || found=1
              [ "$found" -eq 0 ] || {
                echo "presync verify: at least one manifest was DENIED — aborting sync" >&2
                exit 2
              }
              echo "presync verify: all channel manifests allowed"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/fabric/update-agent
              readOnly: true
            - name: manifests
              mountPath: /manifests
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "update-agent.configMapName" . }}
        - name: work
          emptyDir: {}
        - name: manifests
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
