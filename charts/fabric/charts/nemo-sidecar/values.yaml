# Default values for the nemo-sidecar subchart.
#
# The chart does not enforce a latency SLO. Measure /v1/check latency
# against the selected rails and infrastructure before production use.

replicaCount: 1

image:
  repository: ghcr.io/singleaxis/fabric-nemo-sidecar
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 8080

# Shared-token auth on the TCP /v1/* routes. When `tokenSecret.name`
# is set, the sidecar receives FABRIC_SIDECAR_TOKEN from that Secret
# and every TCP /v1/* request must carry a matching X-Fabric-Token header
# (constant-time compare); /healthz stays open for probes. Empty name
# (default) → auth off, behaviour unchanged. Recommended whenever the
# TCP Service is reachable beyond one namespace. Same-pod UDS callers
# are authenticated by socket filesystem permissions and bypass the
# shared-token check.
auth:
  tokenSecret:
    # Name of an existing Secret holding the shared token. Create with:
    #   kubectl create secret generic fabric-nemo-token \
    #     --from-literal=token="$(openssl rand -hex 32)"
    name: ""
    # Key within that Secret.
    key: "token"

resources:
  limits:
    cpu: "1000m"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# /healthz proves that the process is serving requests. Because engine
# construction happens before uvicorn starts, it also proves that the
# configured bundle could be loaded. It does not execute a policy check,
# validate external model credentials, or establish a latency SLO.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Rails configuration.
#
# Resolution order:
#   1. If `railsConfigMap.name` is set → mount that ConfigMap.
#   2. Else if `starterRails.enabled` → validate the in-chart starter
#      declaration and run the deterministic literal-only engine. NeMo
#      is not initialized and no external LLM is used.
#   3. Else if `allowPassthrough=true` → explicit fail-open dev mode.
#   4. Otherwise Helm rendering fails instead of deploying a crash loop.
#
# The starter bundle keeps fresh installs from shipping fail-open,
# but is intentionally minimal. Production profiles should supply a
# full ConfigMap via `railsConfigMap.name`.
railsConfigMap:
  name: ""
  mountPath: /etc/fabric/rails

starterRails:
  enabled: true

# Deterministic input pre-filter. The starter bundle deliberately has
# no model-backed Colang flow, so this MUST remain enabled when the
# starter is selected. The chart rejects that unsafe combination.
# Custom rails may disable it when their own input controls replace it.
literalFilter:
  enabled: true

# Explicit escape hatch for local development only. When no custom or
# starter bundle is selected, setting this to true passes the sidecar's
# --allow-passthrough flag. The default fails safely at Helm render time.
allowPassthrough: false

# PodDisruptionBudget. Honored only when replicaCount > 1 for the
# shared-Service topology shipped by this chart.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy. Default ON so the shipped TCP listener is not a
# cluster-wide oracle. The shared-Service deployment gets ingress
# restricted to same-namespace pods by default; widen via `ingressFrom`
# if callers live in other namespaces (and set auth.tokenSecret — see
# above).
# Egress is DNS-only to kube-system. The starter makes no external LLM
# calls. `egressTo` is only for operator-supplied rails that explicitly
# call an external provider.
networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo: []
