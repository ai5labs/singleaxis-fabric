{{- /*
Starter rails ConfigMap.

The files under files/rails/starter are generated mirrors of the
canonical bundle in components/nemo-sidecar/rails/starter. Run:

  python components/nemo-sidecar/tools/sync_starter_chart_bundle.py

after editing the canonical source. Exact source, packaged-file, and
rendered-ConfigMap equivalence is enforced by the component tests.
*/ -}}
{{- if and (not .Values.railsConfigMap.name) .Values.starterRails.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemo-sidecar.fullname" . }}-rails-starter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemo-sidecar.labels" . | nindent 4 }}
data:
  config.yml: |
{{- .Files.Get "files/rails/starter/config.yml" | nindent 4 }}
  rails.co: |
{{- .Files.Get "files/rails/starter/rails.co" | nindent 4 }}
{{- end -}}
