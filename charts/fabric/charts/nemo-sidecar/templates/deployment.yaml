{{- $effectiveRails := include "nemo-sidecar.effectiveRailsConfigMapName" . -}}
{{- $usingStarter := and (not .Values.railsConfigMap.name) .Values.starterRails.enabled -}}
{{- if and $usingStarter (not .Values.literalFilter.enabled) -}}
{{- fail "nemo-sidecar: starterRails.enabled requires literalFilter.enabled; the starter has no model-backed Colang flows" -}}
{{- end -}}
{{- if and (not $effectiveRails) (not .Values.allowPassthrough) -}}
{{- fail "nemo-sidecar: configure railsConfigMap.name, enable starterRails, or explicitly set allowPassthrough=true for development" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemo-sidecar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemo-sidecar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nemo-sidecar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nemo-sidecar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nemo-sidecar.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nemo-sidecar
          image: {{ include "nemo-sidecar.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.service.port }}"
            {{- if $effectiveRails }}
            - "--rails-config"
            - "{{ .Values.railsConfigMap.mountPath }}"
            {{- end }}
            {{- if $usingStarter }}
            - "--starter-literal-only"
            - "--enable-default-literal-filter"
            {{- else if and .Values.railsConfigMap.name .Values.literalFilter.enabled }}
            - "--enable-default-literal-filter"
            {{- end }}
            {{- if and (not $effectiveRails) .Values.allowPassthrough }}
            - "--allow-passthrough"
            {{- end }}
          {{- if .Values.auth.tokenSecret.name }}
          env:
            - name: FABRIC_SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.tokenSecret.name }}
                  key: {{ .Values.auth.tokenSecret.key }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $effectiveRails }}
            - name: rails-config
              mountPath: {{ .Values.railsConfigMap.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $effectiveRails }}
        - name: rails-config
          configMap:
            name: {{ . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
