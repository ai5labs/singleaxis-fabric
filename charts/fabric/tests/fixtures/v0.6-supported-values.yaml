# N-1 compatibility fixture.
#
# This represents the stable v0.6 collector settings that remain supported in
# v0.7. The removed cross-pod redaction provider keys are intentionally absent;
# their required migration is tested separately by test-values-schema.sh and
# documented in docs/upgrading-v0.6-to-v0.7.md.
tenant:
  id: 11111111-1111-4111-8111-111111111111
  name: schema-compatibility

otelCollector:
  enabled: true

otel-collector:
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent
  fabric:
    guard:
      enabled: true
      dropUnknownClasses: true
      traceProcessingEnabled: true
    policy:
      enabled: false
      bundlePath: ""
    redact:
      enabled: false
    sampler:
      enabled: true
      hmacKey: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      defaultRate: 1.0
      rates:
        decision_summary: 1.0
        escalation: 1.0
  exporter:
    endpoint: https://otlp.example.com
    insecure: false
  debugExporter:
    enabled: false
    verbosity: basic
  networkPolicy:
    enabled: true
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: agent-system
