# Permissive dev profile — NOT FOR PRODUCTION.
#
# Turns on every Layer 1 subchart with the smallest resource footprint
# so a single-node kind cluster can run the public stack. Redaction and
# signed egress are OFF — this profile is only for local feature
# development and CI smoke tests.
#
# Layer 2 subcharts (judge-workers, escalation-service) are not part of
# this chart. For engagements using SingleAxis-internal tooling, install
# the internal umbrella chart on top of this one.

profile:
  name: permissive-dev
  regulations: []
  lockedFields: []

namespace:
  create: true
  name: fabric-system

networkPolicy:
  denyDefault: false

otelCollector:
  enabled: true
otel-collector:
  replicaCount: 1
  fabric:
    redact:
      enabled: false
    policy:
      enabled: true
      bundlePath: ""     # pass-through until Rego is wired
    sampler:
      enabled: true
      # Dev-only placeholder. 64-char hex satisfies the render-time
      # validator (`openssl rand -hex 32`). NEVER use this value in any
      # environment that emits real traces — it is a known constant and
      # the deterministic sampler decisions become trivially replayable.
      hmacKey: "00000000000000000000000000000000000000000000000000000000deadbeef"
  # No exporter endpoint. This profile is for local dev and CI smoke
  # runs, where there is no backend to export to.
  #
  # It previously set `endpoint: http://localhost:4318`, which is the
  # collector's OWN OTLP/HTTP receiver (it binds 0.0.0.0:4318) — every
  # span was re-exported into the pod that emitted it, a self-feeding
  # loop rather than a backend. Leaving the endpoint unset renders no
  # `otlphttp/fabric` exporter at all; the pipelines use `debug`, so
  # spans land in the collector pod's stdout where `kubectl logs` (and
  # the e2e span-landing assertion) can read them.
  exporter:
    endpoint: ""
  debugExporter:
    enabled: true
    verbosity: basic

nemoSidecar:
  enabled: true
nemo-sidecar:
  rails:
    bundlePath: /etc/fabric/rails

# Dev-only Langfuse: disabled by default so CI smoke runs don't need
# Postgres. Flip enabled=true and set database.url to bring up the UI.
langfuse:
  enabled: false
  database:
    url: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
