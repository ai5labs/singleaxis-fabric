# EU AI Act high-risk OSS deployment profile.
#
# Locked fields (see profile.lockedFields) MUST NOT be overridden by
# tenant values — a tenant wanting different behaviour should switch
# to a less strict profile. Enforcement is two layers: the parent
# chart fails at render/template time on any locked override, and the
# update-agent admission backstop keeps the flags set on collector
# ConfigMaps in watched namespaces. See docs/regulatory-profiles.md.
#
# This profile configures the public Connect/Control/Observe/Relay substrate.
# It does not claim that one profile completes a legal conformity assessment.
# Assurance plans, human oversight, evidence retention, and incident workflows
# are selected from the customer's risk assessment and run in a customer-owned
# backend or the SingleAxis Platform.

profile:
  name: eu-ai-act-high-risk
  regulations:
    - eu_ai_act_high_risk
  lockedFields:
    - networkPolicy.denyDefault
    - otel-collector.fabric.guard.enabled
    - otel-collector.fabric.guard.dropUnknownClasses
    - otel-collector.fabric.guard.traceProcessingEnabled
    - otel-collector.fabric.redact.enabled
    - otel-collector.receiver.requireTLS
    - otel-collector.receiver.requireClientCertificate
    - otel-collector.exporter.requireEndpoint
    - otel-collector.exporter.requireTLS
    - otel-collector.exporter.requireAuth
    - otel-collector.exporter.requireDurableQueue
    - otel-collector.exporter.sendingQueue.persistence.enabled
    - otel-collector.networkPolicy.enabled
    - otel-collector.networkPolicy.exporterEgress.requireExplicit
    - update-agent.config.failClosed
    - update-agent.networkPolicy.enabled

namespace:
  create: true
  name: fabric-system

# NetworkPolicy: deny-default at the namespace, paired with explicit
# allow rules rendered by each subchart (otel-collector, nemo-sidecar,
# update-agent). DNS to kube-system is permitted in every subchart's
# rule. This profile locks denyDefault on. Operators whose CNI does not
# enforce NetworkPolicy must select a less strict profile rather than claim
# this posture without an enforcement mechanism.
networkPolicy:
  denyDefault: true

otelCollector:
  enabled: true
otel-collector:
  replicaCount: 2
  # Both OTLP protocols use the same operator-provisioned server identity and
  # verify client certificates against the tenant ingress CA. Secret contents
  # are mounted into the pod and never copied into the Collector ConfigMap.
  receiver:
    requireTLS: true
    requireClientCertificate: true
    tls:
      serverCertificateSecret:
        name: fabric-otel-receiver-tls
        certKey: tls.crt
        keyKey: tls.key
      clientCASecret:
        name: fabric-otel-client-ca
        key: ca.crt
  # A high-risk deployment must name a real OTLP/HTTP backend. With no
  # endpoint the chart's default posture is a debug exporter writing to
  # pod stdout — visible, but not durable and not an audit trail. This
  # profile makes a retention claim, so it fails the render instead of
  # inheriting a dev posture. The operator supplies the endpoint and the
  # exporterEgress peer/port below at install time.
  exporter:
    requireEndpoint: true
    requireTLS: true
    requireAuth: true
    requireDurableQueue: true
    insecure: false
    insecureSkipVerify: false
    auth:
      headerName: Authorization
      secret:
        name: fabric-otel-export-auth
        key: authorization
    sendingQueue:
      enabled: true
      blockOnOverflow: true
      queueSize: 10000
      persistence:
        enabled: true
        fsync: true
        size: 20Gi
    retry:
      enabled: true
      # A value of zero keeps transient failures queued indefinitely.
      # Permanent failures, disk exhaustion, invalid requests and
      # upstream clients that do not retry can still cause loss.
      maxElapsedTime: 0s
  networkPolicy:
    enabled: true
    # Tighten ingress: only pods within fabric-system may post OTLP.
    # Operators bridging from tenant agents in another namespace must
    # extend this list (e.g. add a namespaceSelector for the agent
    # namespace or a podSelector keyed on a known label).
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: fabric-system
    # No destination can be inferred safely from an arbitrary exporter URL.
    # The profile therefore does not ship a misleading in-namespace default:
    # rendering fails until the operator supplies the exact peer and port
    # matching exporter.endpoint.
    exporterEgress:
      requireExplicit: true
      to: []
      ports: []
  fabric:
    guard:
      enabled: true
      dropUnknownClasses: true
    policy:
      enabled: true
      bundlePath: /etc/fabric/policy
      # The chart renders and mounts this immutable v1 ConfigMap. It is
      # only a safe bootstrap admission policy: known Fabric event
      # classes + non-empty event-level tenant_id. It is not tenant
      # authorization. Regulated operators should replace it with an
      # approved bundleConfigMap once their egress policy is available.
      referencePolicy:
        enabled: true
        version: v1
    # PII redaction is pinned on for this profile.
    #
    # The provider is rendered into the Collector pod and shares an
    # emptyDir-backed UDS with the fabricredact processor. This protects
    # exported telemetry; it does not redact input before an LLM call.
    # The named Secret must be provisioned by the operator before the
    # pod can become Ready.
    redact:
      enabled: true
      unixSocket: /var/run/fabric/presidio.sock
      byteHandling: redact_utf8
      embedded:
        enabled: true
        tenantKeySecret:
          name: fabric-presidio-tenant-key
          key: tenant.key
        redactionMode: hmac
    sampler:
      enabled: true
      hmacKeySecret:
        name: fabric-otel-sampler-key
        key: hmac_key
      rates:
        decision_summary: 1.0
        escalation: 1.0
        red_team_result: 1.0

# Do not deploy the umbrella's standalone TCP Presidio Deployment.
# The Collector profile uses the verified pod-local UDS topology above.
presidioSidecar:
  enabled: false

nemoSidecar:
  enabled: true
nemo-sidecar:
  replicaCount: 2
  networkPolicy:
    enabled: true
    # Restrict ingress to fabric-system pods (the SDK guard chain in the
    # tenant's agent reaches NeMo via a UDS socket, not over the network,
    # so the only legitimate TCP callers are otel-collector, redteam-runner,
    # and other intra-namespace components).
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: fabric-system
  # A regulated deployment supplies an approved, versioned rails ConfigMap.
  # The model-free starter is intentionally not treated as a production pack.
  railsConfigMap:
    name: fabric-high-risk-rails
    mountPath: /etc/fabric/rails
  starterRails:
    enabled: false
  literalFilter:
    enabled: true
  allowPassthrough: false

# redteam-runner — COMPLIANCE PIN, NOT AN ENABLE.
#
# The EU AI Act high-risk rubric requires a daily red-team cadence
# with fail-on-findings. This profile pins the compliance knobs but
# deliberately leaves `redteamRunner.enabled` as the subchart default
# (false), because:
#
#   1. Red-team CronJobs attack a live agent endpoint. They cannot
#      run until the operator supplies `redteam-runner.runConfig.inline`
#      with the target URL + a credential reference in extraEnv.
#   2. Auto-enabling with an empty target would render a CronJob that
#      noisily crash-loops against `https://""` — worse than no job.
#
# Operator MUST, at install time:
#   --set redteamRunner.enabled=true
#   --set redteam-runner.runConfig.inline='tenant_id: ...
#                                          agent_id: ...
#                                          target: { url: https://... }
#                                          suites: [...]'
#   (plus extraEnv for bearer tokens — see the subchart README.)
#
# The schedule / failOnFindings / concurrencyPolicy values below are
# applied ONLY when the operator opts in, so they act as compliance
# defaults without rendering a broken CronJob on a dry install.
redteam-runner:
  schedule: "0 2 * * *"             # daily
  failOnFindings: true
  concurrencyPolicy: Forbid

# update-agent defaults for this profile — high-risk deployments must
# gate the manifest channel with fail-closed admission. The tenant
# still has to supply the real signing key and (ideally) cert-manager
# issuer; the profile just pins the posture.
updateAgent:
  enabled: true
update-agent:
  networkPolicy:
    enabled: true
  # The regulated posture never renders a webhook private key into Helm
  # release state. The operator provisions this issuer before installation;
  # cert-manager owns issuance, storage, and rotation of the serving key.
  tls:
    mode: certManager
    certManager:
      issuerRef:
        name: fabric-ca-issuer
        kind: ClusterIssuer
        group: cert-manager.io
  config:
    failClosed: true
  webhook:
    failurePolicy: Fail
    timeoutSeconds: 5
    # Do not rely on `auto` here: on a first install the Namespace does
    # not exist yet for Helm's lookup, which would leave the admission
    # backstop off until a later upgrade.
    enforceProfileLocks: "on"
