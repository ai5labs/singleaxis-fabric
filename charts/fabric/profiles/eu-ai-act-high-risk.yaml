# EU AI Act high-risk profile (Layer 1 only).
#
# The controls listed in profile.lockedFields document the contract and feed
# generic tooling, but they are not its security boundary: values overlays can
# mutate that list. The parent chart keys an exact, non-bypassable invariant
# table on profile.name=eu-ai-act-high-risk. It fails rendering even when an
# overlay clears lockedFields, while the update-agent admission backstop keeps
# collector flags set after deployment. See docs/regulatory-profiles.md.
#
# NOTE: Production EU AI Act deployments also require judge-workers and
# escalation-service from the SingleAxis-internal distribution (Layer 2).
# This Layer 1 profile configures only the public substrate: OTel
# Collector hardening and inline guardrails. Services engagements layer
# the internal chart on top.

profile:
  name: eu-ai-act-high-risk
  regulations:
    - eu_ai_act_high_risk
  lockedFields:
    - otel-collector.fabric.guard.enabled
    - otel-collector.fabric.guard.dropUnknownClasses
    - otel-collector.fabric.guard.traceProcessingEnabled
    - otel-collector.fabric.redact.enabled
    - otel-collector.fabric.policy.enabled
    - otel-collector.exporter.requireEndpoint
    - updateAgent.enabled
    - update-agent.config.failClosed
    - update-agent.webhook.failurePolicy

namespace:
  create: true
  name: fabric-system

# NetworkPolicy: deny-default at the namespace, paired with explicit
# allow rules rendered by each subchart (otel-collector, nemo-sidecar,
# update-agent). DNS to kube-system is permitted in every subchart's
# rule. Operators who run a CNI without NetworkPolicy enforcement can
# flip denyDefault back to false; the per-subchart allows then become
# inert.
networkPolicy:
  denyDefault: true

otelCollector:
  enabled: true
otel-collector:
  replicaCount: 2
  # A high-risk deployment must name a real OTLP/HTTP backend. With no
  # endpoint the chart's default posture is a debug exporter writing to
  # pod stdout — visible, but not durable and not an audit trail. This
  # profile makes a retention claim, so it fails the render instead of
  # inheriting a dev posture. The operator supplies the endpoint (and
  # an egressTo rule below that reaches it) at install time.
  exporter:
    requireEndpoint: true
    # The current profile lock implementation only supports positive
    # (truthy) controls. `requireEndpoint` is locked above and the
    # Collector validator binds that positive lock to HTTPS plus this
    # exact secure TLS posture, rejecting any insecure override.
    insecure: false
  networkPolicy:
    enabled: true
    # Tighten ingress: only pods within fabric-system may post OTLP.
    # Operators bridging from tenant agents in another namespace must
    # extend this list (e.g. add a namespaceSelector for the agent
    # namespace or a podSelector keyed on a known label).
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: fabric-system
    # Default egress: allow the collector to reach the bundled Langfuse
    # and any other in-namespace destinations. External destinations
    # (Datadog, Honeycomb, your own collector chain) require an
    # operator override extending this list. Without an entry covering
    # the collector's configured `exporter.endpoint`, denyDefault=true
    # will silently drop telemetry — see the chart README.
    egressTo:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: fabric-system
  fabric:
    guard:
      enabled: true
      dropUnknownClasses: true
    policy:
      enabled: true
      bundlePath: /etc/fabric/policy
      # This profile deliberately requires a customer-owned policy.
      # Kubernetes will keep the Collector unready if this ConfigMap
      # does not exist, rather than starting with a no-op or empty
      # policy. Populate it with one or more .rego files implementing
      # data.fabric.egress.allow before installation, or override this
      # name with another approved ConfigMap.
      bundleConfigMap: fabric-high-risk-egress-policy
    # PII redaction is pinned on for this profile.
    #
    # A real Presidio provider is co-located with every Collector
    # replica and communicates over a same-pod shared UDS volume. The
    # Secret is customer-owned; a missing Secret prevents pod startup.
    redact:
      enabled: true
      unixSocket: /var/run/fabric/presidio.sock
      provider:
        mode: sidecar
        sidecar:
          tenantKeySecret:
            name: fabric-presidio-tenant-key
            key: tenant.key
    sampler:
      enabled: true
      hmacKeySecret:
        name: fabric-otel-sampler-key
        key: hmac_key
      rates:
        decision_summary: 1.0
        escalation: 1.0
        red_team_result: 1.0

nemoSidecar:
  enabled: true
nemo-sidecar:
  replicaCount: 2
  # A regulated deployment supplies an approved, versioned rails
  # ConfigMap. The model-free starter is intentionally not treated as
  # a production policy pack.
  railsConfigMap:
    name: fabric-high-risk-rails
    mountPath: /etc/fabric/rails
  starterRails:
    enabled: false
  literalFilter:
    enabled: true
  allowPassthrough: false
  networkPolicy:
    enabled: true
    # Restrict ingress to fabric-system pods (the SDK guard chain in the
    # tenant's agent reaches NeMo via a UDS socket, not over the network,
    # so the only legitimate TCP callers are otel-collector, redteam-runner,
    # and other intra-namespace components).
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: fabric-system

# redteam-runner — COMPLIANCE PIN, NOT AN ENABLE.
#
# The EU AI Act high-risk rubric requires a daily red-team cadence
# with fail-on-findings. This profile pins the compliance knobs but
# deliberately leaves `redteamRunner.enabled` as the subchart default
# (false), because:
#
#   1. Red-team CronJobs attack a live agent endpoint. They cannot
#      run until the operator supplies `redteam-runner.runConfig.inline`
#      with the target URL + a credential reference in extraEnv.
#   2. Auto-enabling with an empty target would render a CronJob that
#      noisily crash-loops against `https://""` — worse than no job.
#
# Operator MUST, at install time:
#   --set redteamRunner.enabled=true
#   --set redteam-runner.runConfig.inline='tenant_id: ...
#                                          agent_id: ...
#                                          target: { url: https://... }
#                                          suites: [...]'
#   (plus extraEnv for bearer tokens — see the subchart README.)
#
# The schedule / failOnFindings / concurrencyPolicy values below are
# applied ONLY when the operator opts in, so they act as compliance
# defaults without rendering a broken CronJob on a dry install.
redteam-runner:
  schedule: "0 2 * * *"             # daily
  failOnFindings: true
  concurrencyPolicy: Forbid

# update-agent defaults for this profile — high-risk deployments must
# gate the manifest channel with fail-closed admission. The tenant
# still has to supply the real signing key and (ideally) cert-manager
# issuer; the profile just pins the posture.
updateAgent:
  enabled: true
update-agent:
  networkPolicy:
    enabled: true
  config:
    failClosed: true
  webhook:
    failurePolicy: Fail
    timeoutSeconds: 5
    # Do not rely on `auto` here: on a first install the Namespace does
    # not exist yet for Helm's lookup, which would leave the admission
    # backstop off until a later upgrade.
    enforceProfileLocks: "on"
