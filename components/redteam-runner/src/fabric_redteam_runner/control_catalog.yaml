#
# Fabric control catalog — the shared vocabulary that makes
# pre-deployment red-team evidence joinable to production guardrail
# evidence (spec 024 §4).
#
# A *control* is a named defensive capability ("prompt injection,
# inbound"). It is NOT an implementation and NOT a test:
#
#   implementations:  vendor rail / policy ids seen in production
#                     (`fabric.guardrail.policies`, GuardrailSummary.rail_id)
#   probes:           "<suite>:<probe>" ids seen in red-team runs
#
# Swapping a vendor changes `implementations` and leaves the audit
# trail intact. Joining on `rail_id` instead of `control.id` would
# break on every vendor swap, which is why the indirection exists.
#
# `catalog_version` is stamped onto BOTH sides of the join. A remap
# bumps it, which makes the join fail loudly rather than silently
# re-point old evidence at a new definition. Bump it whenever any
# `probes` or `implementations` entry moves between controls.
#
# Operators override this file with `--controls-catalog` /
# FABRIC_REDTEAM_CONTROLS_CATALOG.

catalog_version: "1.0.0"

controls:
  - id: injection.input
    title: Prompt injection (inbound)
    frameworks: [owasp-llm01, eu-ai-act-art15, nist-ai-rmf-measure-2.7]
    implementations:
      - nemo.self_check_input
      - lakera.prompt_injection
      - promptguard.jailbreak
    probes:
      - garak:promptinject.PromptInject
      - garak:promptinject.HijackHateHumans
      - garak:dan.Dan_11_0
      - garak:dan.DanInTheWild
      - pyrit:prompt_injection
      - pyrit:jailbreak_fuzzer

  - id: pii.output
    title: Sensitive information disclosure (outbound)
    frameworks: [owasp-llm06, gdpr-art32, eu-ai-act-art10]
    implementations:
      - presidio.PERSON
      - presidio.EMAIL_ADDRESS
      - presidio.CREDIT_CARD
      - presidio.PHONE_NUMBER
      - nemo.self_check_output
    probes:
      - garak:leakreplay.LiteratureCloze
      - garak:xss.MarkdownImageExfil
      - pyrit:pii_extraction

  - id: toxicity.output
    title: Toxic or harmful generation (outbound)
    frameworks: [owasp-llm02, eu-ai-act-art15]
    implementations:
      - nemo.self_check_output_toxicity
      - lakera.moderated_content
    probes:
      - garak:continuation.ContinueSlursReclaimedSlurs80
      - garak:realtoxicityprompts.RTPSevere_Toxicity
      - pyrit:harmful_content

  - id: exfiltration.system_prompt
    title: System prompt / instruction disclosure
    frameworks: [owasp-llm07, eu-ai-act-art15]
    implementations:
      - nemo.self_check_output
      - lakera.system_prompt_leak
    probes:
      - garak:leakreplay.GuardianCloze
      - pyrit:system_prompt_extraction
