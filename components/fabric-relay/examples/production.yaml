receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/fabric-relay/receiver/server/tls.crt
          key_file: /etc/fabric-relay/receiver/server/tls.key
          client_ca_file: /etc/fabric-relay/receiver/client-ca/ca.crt
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/fabric-relay/receiver/server/tls.crt
          key_file: /etc/fabric-relay/receiver/server/tls.key
          client_ca_file: /etc/fabric-relay/receiver/client-ca/ca.crt

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/fabric-relay/queue
    create_directory: true
    timeout: 1s
    compaction:
      directory: /var/lib/fabric-relay/compaction
      on_start: true
      on_rebound: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 192
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/destination:
    endpoint: https://telemetry.example.invalid
    headers:
      Authorization: ${env:FABRIC_RELAY_AUTH_HEADER}
    tls:
      insecure: false
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 10000
      storage: file_storage
      block_on_overflow: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/destination]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/destination]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/destination]
