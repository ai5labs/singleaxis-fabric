# SingleAxis Fabric — harness Colang rails bundle.
#
# This is the STARTER bundle plus a `models:` entry. It exists because
# components/nemo-sidecar/rails/starter/ ships with `models: []`, which is
# correct for a distributed default (operators supply their own model) but
# means the sidecar returns HTTP 500 on any input that does not match the
# literal jailbreak filter:
#
#   LLMCallException: LLM Call Exception: No LLM provided to llm_call()
#
# The model below is a LOCAL Ollama instance reached over Docker Desktop's
# host-gateway. This is deliberate and should stay that way: NeMo sends every
# guarded input to the configured model, and the harness scenarios carry
# deliberately realistic PII and PHI. Pointing this at a hosted API would
# egress exactly the data the redaction tests exist to protect.
#
# Ollama exposes an OpenAI-compatible API at /v1, so we use NeMo's `openai`
# engine and the langchain-openai client the sidecar already bundles — no
# image rebuild required.
#
# Prerequisite on the host:
#   ollama pull llama3.2:3b   (and ollama must be serving on :11434)

models:
  - type: main
    engine: openai
    model: llama3.2:3b
    parameters:
      base_url: http://host.docker.internal:11434/v1
      api_key: ollama
      temperature: 0.0

# No Colang flows are active. Jailbreak detection is the sidecar's
# deterministic literal pre-filter (--enable-default-literal-filter), which
# runs before NeMo and needs no model. The model above exists so that inputs
# which do NOT match a pattern can complete instead of raising.
rails:
  input:
    flows: []
  output:
    flows: []
