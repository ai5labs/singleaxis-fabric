name: fabric-node-evaluation

networks:
  fabric-node:
    driver: bridge

volumes:
  fabric-queue:
  sink-data:

services:
  # Docker named volumes are initially owned by root, while the released
  # distroless Fabric Node runs as UID/GID 65532. Prepare only the recorder
  # queue volume before startup so the evaluation harness exercises the same
  # non-root posture as the production chart.
  queue-init:
    image: python:3.12-alpine
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /queue && chmod 0700 /queue"]
    volumes:
      - fabric-queue:/queue
    restart: "no"

  # Controlled evaluation destination. It returns 200 only after writing and
  # fsyncing the received request. That is a property of this test sink, not a
  # persistence guarantee Fabric can infer from arbitrary OTLP destinations.
  test-sink:
    image: python:3.12-alpine
    command: ["python", "/app/otlp_sink.py"]
    environment:
      SINK_DATA_DIR: /var/lib/fabric-test-sink
      SINK_PORT: "8080"
    volumes:
      - ./sink/otlp_sink.py:/app/otlp_sink.py:ro
      - sink-data:/var/lib/fabric-test-sink
    ports:
      - "${FABRIC_SINK_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks: [fabric-node]

  # Fabric Node v1 is one customer-facing service. The custom Collector is its
  # current implementation: receive -> allowlist -> persistent queue -> OTLP.
  fabric-node:
    build:
      context: ../../components/otel-collector-fabric
      dockerfile: Dockerfile
    image: fabric/node:evaluation
    command: ["--config=/etc/fabric-node/collector.yaml"]
    volumes:
      - ./collector-config/collector.yaml:/etc/fabric-node/collector.yaml:ro
      - fabric-queue:/var/lib/fabric-node/queue
    ports:
      - "${FABRIC_OTLP_GRPC_PORT:-4317}:4317"
      - "${FABRIC_OTLP_HTTP_PORT:-4318}:4318"
      - "${FABRIC_HEALTH_PORT:-13133}:13133"
    depends_on:
      queue-init:
        condition: service_completed_successfully
      test-sink:
        condition: service_healthy
    restart: unless-stopped
    networks: [fabric-node]
