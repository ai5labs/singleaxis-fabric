apiVersion: fabric.singleaxis.dev/v1alpha1
kind: FabricSecretRequirements
metadata:
  name: unsafe-secrets
status: unresolved
requirements:
  - name: fabric-exporter-token
    namespace: singleaxis-fabric
    keys: [token]
    purpose: exporter-authentication
    consumer: fabric-relay
    value: plaintext-token-must-not-appear
